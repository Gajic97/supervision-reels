<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
.L{position:absolute;inset:0}
#night{background:radial-gradient(1300px 1000px at 50% 34%,#163a2b 0%,#0d2219 55%,#061009 100%)}
#day{background:linear-gradient(180deg,#e9f6ef 0%,#f6fbf8 55%,#ffffff 100%);opacity:0}
#blk{background:radial-gradient(1200px 900px at 50% 40%,#0f1b2b 0%,#070c14 70%,#03060a 100%);opacity:0}
#stars i{position:absolute;width:4px;height:4px;border-radius:2px;background:#fff}
#glow{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
#waves{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
#prod{position:absolute;left:190px;top:640px;width:700px;height:700px;transform-origin:50% 50%}
#prod img{width:100%;height:100%;filter:drop-shadow(0 40px 60px rgba(0,0,0,.45))}
#h{position:absolute;top:190px;left:70px;right:70px;text-align:center}
#h .a{font-weight:800;font-size:100px;line-height:1.04;color:#fff;letter-spacing:-1px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:62px;line-height:1.1;color:#6cc08f;margin-top:26px}
.dark #h .a{color:#123528}
.dark #h .a em{color:#2f7a50}
#chip{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#chip span{background:#123528;color:#fff;font-weight:700;font-size:48px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.3)}
#chip span b{color:#6cc08f}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-2px}
#stamp div em{font-style:normal;color:#6cc08f}
#price{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center}
#price .card{margin-top:1180px;background:#fff;border-radius:44px;padding:44px 70px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45)}
#price .nm{font-weight:600;font-size:36px;color:#2f7a50}
#price .pr{font-weight:800;font-size:132px;color:#123528;line-height:1.1}
#price .pr small{font-size:60px}
#price .cta{margin-top:56px;color:#fff;font-weight:700;font-size:54px}
#price .cta b{color:#6cc08f}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px}
#logo img{width:58px;height:58px;border-radius:14px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body>
<div id="night" class="L"></div>
<div id="stars" class="L"></div>
<div id="day" class="L"></div>
<div id="blk" class="L"></div>
<svg id="glow" viewBox="0 0 1080 1920"><defs><radialGradient id="gg" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#ffb86b" stop-opacity=".9"/><stop offset=".5" stop-color="#ffa64d" stop-opacity=".45"/><stop offset="1" stop-color="#6cc08f" stop-opacity="0"/></radialGradient></defs>
<circle cx="540" cy="900" r="620" fill="url(#gg)"/></svg>
<svg id="waves" viewBox="0 0 1080 1920" fill="none" stroke="#2f7a50" stroke-width="12" stroke-linecap="round">
<path id="w1"/><path id="w2"/><path id="w3"/><path id="w4"/><path id="w5"/><path id="w6"/></svg>
<div id="prod"><img src="assets/h4.png"></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="price"><div class="card"><div class="nm">EZVIZ CS-H4 Wi-Fi dome kamera 2K</div><div class="pr"><span id="pv">8.190</span> <small>RSD</small></div></div>
<div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const st=$('stars');let s=11;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
const SP=[...Array(60)].map(()=>{const i=document.createElement('i');i.style.left=rnd()*1080+'px';i.style.top=rnd()*1100+'px';st.appendChild(i);return rnd()*6.28});
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Zvono ne čuješ. <em>Telefon</em> čuješ.','Javi se i kad nisi kod vrata.'],
 [2.6,5.4,'<em>Pričaš</em> kroz kameru.',''],
 [5.4,8.4,'Noću slika <em>u boji</em>.',''],
];
const CH=[[3.1,5.4,'Mikrofon <b>+</b> zvučnik'],[5.9,8.4,'Pametni režim · IR do <b>30 m</b>']];
const ST=[[8.4,9.2,'<em>2K</em><br>slika.'],[9.2,10.0,'<em>IP67</em><br>kućište.'],[10.0,10.9,'Osoba<br>ili <em>auto</em>?<br>AI zna.']];
function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`}
window.render=function(t){
 const day=t<2.6?0:t<2.85?ease((t-2.6)/0.25):t<5.4?1:1-ease(cl((t-5.4)/0.25));
 const blk=t>=5.4&&t<8.4?ease(cl((t-5.4)/0.25)):0;
 $('day').style.opacity=day;$('blk').style.opacity=blk;
 document.body.classList.toggle('dark',day>0.5);
 $('stars').style.opacity=Math.max(1-day,blk)*(t<8.4?1:0.6);
 [...st.children].forEach((e,i)=>e.style.opacity=0.35+0.4*Math.sin(t*2+SP[i]));
 // proizvod: ulet od 0. kadra
 let sc=1,x=0,y=0,rot=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=1.26-0.2*p+0.02*Math.sin(t*3);y=60-60*p;rot=-5+5*p;}
 else if(t<5.4){const p=ease(cl((t-2.6)/0.6));sc=0.9+0.04*(t-2.6)/2.8;y=-60+30*(1-p);x=0;}
 else if(t<8.4){sc=0.98+0.05*(t-5.4)/3;y=-80;}
 else if(t<10.9){sc=0.6;y=-470;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.84-0.06*p;y=-230-30*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 $('prod').style.transform=`translate(${x}px,${y}px) scale(${sc}) rotate(${rot}deg)`;
 // talasi zvuka (scena 2)
 const wo=t>=2.6&&t<5.4?cl((t-2.75)/0.2)*cl((5.4-t)/0.15):0;$('waves').style.opacity=wo;
 if(wo>0){const cy=870;for(let k=0;k<3;k++){const ph=((t-2.6)*1.1+k/3)%1;const r=380+ph*170;const op=(1-ph);
   const L=$('w'+(k+1)),R=$('w'+(k+4));
   L.setAttribute('d',arc(540,cy,r,Math.PI*0.86,Math.PI*1.14));R.setAttribute('d',arc(540,cy,r,-Math.PI*0.14,Math.PI*0.14));
   L.style.opacity=R.style.opacity=op;}}
 // sjaj u boji (scena 3)
 const go=blk*(t<5.9?(Math.sin(t*80)>0?1:0.35):1);$('glow').style.opacity=go*(0.85+0.12*Math.sin(t*4));
 $('glow').style.transform=`scale(${0.9+0.1*cl((t-5.4)/3)})`;$('glow').style.transformOrigin='540px 900px';
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').textContent=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.85+0.15*p})`;
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(120px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // cena
 const po=ease(cl((t-10.9)/0.35));$('price').style.opacity=po;$('price').style.transform=`translateY(${(1-po)*80}px)`;
 const v=Math.round(8190*ease(cl((t-11.0)/0.9)));$('pv').textContent=v.toLocaleString('de-DE');
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.55*(1-d/0.12))});$('flash').style.opacity=f;
 $('logo').style.color=day>0.5?'#123528':'#fff';
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>render(0));
</script></body></html>
