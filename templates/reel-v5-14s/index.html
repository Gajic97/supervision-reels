<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:60px;right:60px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.02;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:160px;top:640px;width:760px;height:760px;transform-origin:50% 50%}
#prod img{width:100%;height:100%;filter:drop-shadow(0 50px 70px rgba(0,0,0,.55))}
.lens{position:absolute;width:0;height:0}
.lens i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:6px solid #6cc08f}
.lens b{position:absolute;white-space:nowrap;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:40px;padding:8px 22px;border-radius:40px}
#l1{left:58%;top:50%}#l1 b{left:90px;top:-150px}
#l2{left:53%;top:74%}#l2 b{left:-330px;top:40px}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
#pip{position:absolute;right:30px;top:30px;width:330px;height:330px;border-radius:24px;overflow:hidden;border:6px solid #6cc08f;box-shadow:0 20px 40px rgba(0,0,0,.5);opacity:0;background:#0f2a1f}
#pip svg{position:absolute;left:0;top:0;width:980px;height:700px;transform-origin:0 0}
#pip .tag{position:absolute;left:12px;bottom:12px;background:rgba(11,26,20,.85);color:#6cc08f;font-weight:700;font-size:26px;padding:4px 14px;border-radius:20px}
#rec{position:absolute;left:30px;top:26px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:28px;opacity:0}
#rec i{width:18px;height:18px;border-radius:50%;background:#ff4d4d}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#price{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;z-index:7}
#price .card{margin-top:1190px;background:#fff;border-radius:44px;padding:40px 70px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45)}
#price .nm{font-weight:600;font-size:34px;color:#2f7a50}
#price .pr{font-weight:800;font-size:132px;color:#123528;line-height:1.1}
#price .pr small{font-size:60px}
#price .cta{margin-top:56px;color:#fff;font-weight:700;font-size:54px}
#price .cta b{color:#6cc08f}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a2b"/><stop offset="1" stop-color="#245740"/></linearGradient>
<linearGradient id="fovw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f0cf" stop-opacity=".75"/><stop offset="1" stop-color="#b8f0cf" stop-opacity=".18"/></linearGradient>
<linearGradient id="fovn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b8" stop-opacity=".75"/><stop offset="1" stop-color="#fff2b8" stop-opacity=".1"/></linearGradient>
<g id="yard">
 <rect width="980" height="700" fill="url(#sky)"/>
 <g fill="#fff" opacity=".5"><circle cx="760" cy="70" r="3"/><circle cx="860" cy="120" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="910" cy="40" r="3"/></g>
 <circle cx="840" cy="90" r="34" fill="#e9f6ef" opacity=".85"/>
 <rect y="430" width="980" height="270" fill="#1d4a35"/>
 <path d="M0 430 Q490 400 980 430 L980 445 L0 445Z" fill="#2a6447"/>
 <!-- kuća -->
 <rect x="40" y="250" width="260" height="190" fill="#e9efe9"/><path d="M20 260 L170 150 L320 260Z" fill="#2f7a50"/>
 <rect x="90" y="300" width="60" height="60" fill="#ffd77a"/><rect x="200" y="330" width="60" height="110" fill="#8a6a4a"/>
 <!-- drvo -->
 <rect x="890" y="300" width="22" height="140" fill="#6b4e33"/><circle cx="900" cy="280" r="70" fill="#2f7a50"/><circle cx="860" cy="310" r="45" fill="#3a8c5e"/>
 <!-- ograda i kapija -->
 <g stroke="#cfe9da" stroke-width="6" opacity=".8"><line x1="330" y1="410" x2="980" y2="410"/>
 <line x1="350" y1="380" x2="350" y2="440"/><line x1="420" y1="380" x2="420" y2="440"/><line x1="490" y1="380" x2="490" y2="440"/><line x1="720" y1="380" x2="720" y2="440"/><line x1="790" y1="380" x2="790" y2="440"/><line x1="860" y1="380" x2="860" y2="440"/></g>
 <rect x="540" y="372" width="140" height="70" fill="none" stroke="#cfe9da" stroke-width="8"/>
 <!-- staza i auto -->
 <path d="M610 700 L590 445 L640 445 L700 700Z" fill="#3c6b55"/>
 <g transform="translate(380 520)"><rect width="200" height="70" rx="22" fill="#d9e4de"/><rect x="40" y="-40" width="120" height="50" rx="18" fill="#d9e4de"/><rect x="55" y="-30" width="40" height="30" rx="6" fill="#5b7f6d"/><rect x="105" y="-30" width="40" height="30" rx="6" fill="#5b7f6d"/><circle cx="45" cy="72" r="22" fill="#0b1a14"/><circle cx="155" cy="72" r="22" fill="#0b1a14"/></g>
</g>
<g id="person"><circle cx="0" cy="-118" r="22" fill="#fff"/><path d="M-26 -90 Q0 -100 26 -90 L22 -20 L-22 -20Z" fill="#fff"/><rect x="-22" y="-22" width="16" height="22" fill="#fff"/><rect x="6" y="-22" width="16" height="22" fill="#fff"/></g>
</defs></svg>
<div id="card">
 <svg viewBox="0 0 980 700"><use href="#yard"/>
  <path id="fovW" d="M175 205 L-200 700 L1180 700Z" fill="url(#fovw)" stroke="#b8f0cf" stroke-width="4" stroke-dasharray="14 10" opacity="0"/>
  <path id="fovN" fill="url(#fovn)" opacity="0"/>
  <use id="p1" href="#person"/>
  <rect id="trk" width="110" height="170" fill="none" stroke="#6cc08f" stroke-width="6" stroke-dasharray="18 10" opacity="0"/>
  <g transform="translate(175 205)"><circle r="20" fill="#fff"/><circle r="9" fill="#0b1a14"/></g>
 </svg>
 <div id="rec"><i></i>2,8 mm · uživo</div>
 <div id="pip"><svg viewBox="0 0 980 700"><use href="#yard"/><use id="p2" href="#person"/></svg><div class="tag">6 mm</div></div>
</div>
<div id="prod"><img src="assets/hb90.png"><div class="lens" id="l1"><i></i><b>2,8 mm · širok</b></div><div class="lens" id="l2"><i></i><b>6 mm · detalj</b></div></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="price"><div class="card"><div class="nm">EZVIZ CS-HB90 · 4 MP + 4 MP · solarni panel</div><div class="pr"><span id="pv">26.910</span> <small>RSD</small></div></div>
<div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'<em>2</em> objektiva.<br><em>1</em> kamera.','Ceo plac <em>i</em> ko ulazi.'],
 [2.6,5.4,'Gornji drži <em>celu scenu</em>.',''],
 [5.4,8.4,'Donji <em>prati</em> pokret.',''],
];
const CH=[[3.0,5.4,'<b>2,8 mm</b> · široki pregled'],[5.8,8.4,'<b>6 mm</b> · snimaju <b>istovremeno</b>']];
const ST=[[8.4,9.2,'Noću do<br><em>35 m</em>.'],[9.2,10.0,'Panel <em>8 W</em><br>u paketu.'],[10.0,10.9,'Jedan nosač.<br>Jedna<br><em>baterija</em>.']];
// osoba hoda od kapije ka kući
const px=t=>610-280*cl((t-4.2)/4.0);const py=t=>470+120*cl((t-4.2)/4.0);
window.render=function(t){
 // proizvod
 let sc=1,x=0,y=0,rot=0,po=1;
 if(t<2.6){const p=ease(cl(t/0.9));sc=1.3-0.22*p+0.015*Math.sin(t*3);y=40-40*p;rot=-6+6*p;}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.62;y=-520;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.82-0.05*p;y=-250-20*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 $('prod').style.opacity=po;$('prod').style.transform=`translate(${x}px,${y}px) scale(${sc}) rotate(${rot}deg)`;
 // oznake objektiva u hook-u
 [['l1',0.9],['l2',1.3]].forEach(([id,t0])=>{const e=$(id);const v=t<2.6?ease(cl((t-t0)/0.3)):0;e.style.opacity=v;
   const r=e.querySelector('i');const ph=((t-t0)*1.4)%1;r.style.transform=`scale(${0.8+0.5*ph})`;r.style.opacity=1-ph;
   e.querySelector('b').style.transform=`scale(${0.7+0.3*back(cl((t-t0)/0.35))})`;});
 // kartica dvorišta
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${t<5.4?0.96+0.04*co:1})`;
 const wO=t>=2.6&&t<8.4?cl((t-2.9)/0.3)*(t<5.4?1:0.35):0;$('fovW').setAttribute('opacity',wO*(0.85+0.15*Math.sin(t*6)));
 $('rec').style.opacity=t>=2.9&&t<8.4?1:0;$('rec').querySelector('i').style.opacity=Math.sin(t*8)>0?1:0.2;
 const X=px(t),Y=py(t);$('p1').setAttribute('transform',`translate(${X} ${Y}) scale(${0.7+0.3*cl((t-4.2)/4)})`);
 // uski snop prati osobu
 const nO=t>=5.4&&t<8.4?cl((t-5.5)/0.25):0;
 const tx=X,ty=Y-60;$('fovN').setAttribute('d',`M175 205 L${tx-70} ${ty-90} L${tx+70} ${ty+90}Z`);$('fovN').setAttribute('opacity',nO*0.9);
 const tr=$('trk');tr.setAttribute('x',X-55);tr.setAttribute('y',Y-160);tr.setAttribute('opacity',nO);
 // slika u slici (6 mm)
 const pip=$('pip');const pO=t>=5.8&&t<8.4?back(cl((t-5.8)/0.35)):0;pip.style.opacity=cl(pO);pip.style.transform=`scale(${0.6+0.4*cl(pO,0,1.1)})`;pip.style.transformOrigin='100% 0';
 const Z=2.4;const s2=pip.querySelector('svg');s2.style.transform=`translate(${165-X*Z}px,${165-(Y-70)*Z}px) scale(${Z})`;
 $('p2').setAttribute('transform',`translate(${X} ${Y}) scale(${0.7+0.3*cl((t-4.2)/4)})`);
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'124px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.1)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.1)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(160px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // cena
 const pr=ease(cl((t-10.9)/0.35));$('price').style.opacity=pr;$('price').style.transform=`translateY(${(1-pr)*80}px)`;
 $('pv').textContent=Math.round(26910*ease(cl((t-11.0)/0.9))).toLocaleString('de-DE');
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>render(0));
</script></body></html>
