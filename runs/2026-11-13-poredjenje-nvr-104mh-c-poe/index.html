<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#bar{position:absolute;top:0;left:0;height:8px;background:#6cc08f;z-index:10}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.02;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
.pt{position:absolute;width:420px;height:420px;transform-origin:50% 50%}
.pt img{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 40px 50px rgba(0,0,0,.5))}
.pt .lb{position:absolute;left:0;right:0;top:440px;text-align:center}
.pt .lb span{display:inline-block;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:44px;padding:10px 30px;border-radius:40px;white-space:nowrap}
#pB .lb span{background:#fff;color:#123528}
.glow{position:absolute;width:520px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(108,192,143,.5),rgba(108,192,143,0))}
#vs{position:absolute;left:490px;top:960px;width:100px;height:100px;border-radius:50%;background:#123528;border:4px solid #6cc08f;color:#fff;font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center;z-index:3}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
#tag{position:absolute;left:26px;top:22px;background:rgba(11,26,20,.8);color:#cfe9da;font-weight:700;font-size:28px;padding:6px 18px;border-radius:20px;opacity:0}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:140px;line-height:1.05;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#stamp div small{font-size:70px;color:#cfe9da;letter-spacing:0}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .im{position:absolute;left:260px;top:620px;width:560px;height:560px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.18))}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .pr b{color:#6cc08f}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1" style="width:520px;height:520px;background:#2f7a50"></div>
<div class="blob" id="b2" style="width:420px;height:420px;background:#439665"></div>
<div id="endbg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="cam"><rect x="-30" y="-14" width="52" height="28" rx="12" fill="#fff"/><circle cx="-30" cy="0" r="10" fill="#0b1a14"/><rect x="16" y="-5" width="18" height="10" fill="#cfe9da"/></g>
<linearGradient id="nite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a2b"/><stop offset="1" stop-color="#245740"/></linearGradient>
<g id="house">
 <rect width="980" height="700" fill="url(#nite)"/>
 <rect y="600" width="980" height="100" fill="#1d4a35"/>
 <rect x="120" y="250" width="740" height="350" fill="#e9efe9" opacity=".12" stroke="#cfe9da" stroke-width="6"/>
 <path d="M90 260 L490 90 L890 260" fill="none" stroke="#cfe9da" stroke-width="8"/>
</g>
<g id="nvr"><rect x="-90" y="-28" width="180" height="56" rx="10" fill="#1a1f1d" stroke="#6cc08f" stroke-width="4"/><circle cx="40" cy="0" r="5" fill="#6cc08f"/><circle cx="58" cy="0" r="5" fill="#6cc08f"/><text x="-70" y="9" fill="#fff" font-family="Poppins" font-weight="800" font-size="24">NVR</text></g>
</defs></svg>
<div id="card">
 <!-- scena A: PoE u snimaču, jedan kabl po kameri -->
 <svg id="sA" viewBox="0 0 980 700">
  <use href="#house"/>
  <g id="cabA" fill="none" stroke-width="8" stroke-linecap="round">
   <path d="M400 510 L250 510 L250 270 L205 270"/><path d="M580 510 L730 510 L730 270 L775 270"/>
   <path d="M400 530 L300 530 L300 560 L205 560"/><path d="M580 530 L680 530 L680 560 L775 560"/>
  </g>
  <g id="dotsA"></g>
  <g transform="translate(170 270)"><use href="#cam" transform="scale(-1 1)"/></g>
  <g transform="translate(810 270)"><use href="#cam"/></g>
  <g transform="translate(170 560)"><use href="#cam" transform="scale(-1 1)"/></g>
  <g transform="translate(810 560)"><use href="#cam"/></g>
  <g transform="translate(490 520)"><use href="#nvr"/></g>
  <g id="lblA" opacity="0"><rect x="300" y="140" width="380" height="60" rx="30" fill="#6cc08f"/><text x="490" y="181" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28">1 kabl: slika + struja</text></g>
 </svg>
 <!-- scena B: bez PoE, poseban svič -->
 <svg id="sB" viewBox="0 0 980 700" style="opacity:0">
  <use href="#house"/>
  <g transform="translate(170 270)"><use href="#cam" transform="scale(-1 1)"/></g>
  <g transform="translate(810 270)"><use href="#cam"/></g>
  <g transform="translate(170 560)"><use href="#cam" transform="scale(-1 1)"/></g>
  <g transform="translate(810 560)"><use href="#cam"/></g>
  <g id="cabB" fill="none" stroke="#fff2b8" stroke-width="8" stroke-linecap="round" opacity="0">
   <path d="M420 400 L170 400 L170 290"/><path d="M560 400 L810 400 L810 290"/>
   <path d="M420 410 L250 410 L250 560 L200 560"/><path d="M560 410 L730 410 L730 560 L780 560"/>
   <path d="M490 430 L490 492"/>
  </g>
  <g id="swB" opacity="0"><rect x="400" y="365" width="180" height="60" rx="10" fill="#fff2b8"/><g fill="#0b1a14"><rect x="420" y="400" width="20" height="14"/><rect x="450" y="400" width="20" height="14"/><rect x="480" y="400" width="20" height="14"/><rect x="510" y="400" width="20" height="14"/></g><text x="490" y="393" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="22">PoE svič</text>
   <path d="M580 395 L640 395 L640 330" fill="none" stroke="#fff2b8" stroke-width="6"/><rect x="622" y="300" width="36" height="34" rx="6" fill="#fff2b8"/><rect x="630" y="288" width="6" height="14" fill="#fff2b8"/><rect x="644" y="288" width="6" height="14" fill="#fff2b8"/></g>
  <g transform="translate(490 520)"><use href="#nvr"/></g>
  <g id="lblB" opacity="0"><rect x="290" y="140" width="400" height="60" rx="30" fill="#fff2b8"/><text x="490" y="181" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28">+ uređaj za napajanje</text></g>
 </svg>
 <div id="tag">Primer</div>
</div>
<div class="glow" id="gA"></div><div class="glow" id="gB"></div>
<div class="pt" id="pA"><img src="assets/prod.png"><div class="lb"><span>A · sa PoE</span></div></div>
<div class="pt" id="pB"><img src="assets/prodb.png"><div class="lb"><span>B · bez PoE</span></div></div>
<div id="vs">ili</div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="bar"></div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">NVR SNIMAČ · 4 KANALA · PoE</div><img class="im" src="assets/prod.png"><div class="nm">HiLook NVR-104MH-C/4P(B)</div><div class="sub">4 PoE porta · kamere do 8 MP</div>
<div class="pr"><span><span id="pv">16.180</span> <b>RSD</b></span></div><div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const PRICE=16180;
const H=[
 [0,2.6,'Ako imaš<br><em>4 IP kamere</em>,','<em>NVR snimač</em>: sa PoE ili bez?'],
 [2.6,5.4,'<em>A:</em> kamere<br>napaja snimač.',''],
 [5.4,8.4,'<em>B:</em> treba poseban<br>PoE svič.',''],
];
const CH=[[3.0,5.4,'<b>4 PoE porta</b> u snimaču'],[5.8,8.4,'<b>ili adapter</b> za kamere']];
const ST=[[8.4,9.2,'Oba do<br><em>8 MP</em>.'],[9.2,10.0,'<em>A</em> 16.180<br><em>B</em> 11.120<br><small>RSD</small>'],[10.0,10.9,'<em>A</em> ili <em>B</em>?<br>Napiši.']];
// tačke koje putuju kablovima u sceni A
const PA=[...document.querySelectorAll('#cabA path')];const dA=$('dotsA');
PA.forEach((p,i)=>{if(p.getAttribute('opacity')==='0')return;for(let k=0;k<3;k++)dA.insertAdjacentHTML('beforeend',`<circle class="dt" data-p="${i}" data-k="${k}" r="9" fill="#fff"/>`)});
window.render=function(t){
 $('bar').style.width=(1080*t/14)+'px';
 $('b1').style.transform=`translate(${120+120*Math.sin(t*0.7)}px,${300+90*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.6)}px,${1200+120*Math.sin(t*0.8)}px)`;
 // dva snimača: hook (veliki, jedan pored drugog), pečati (mali gore), skriveni u scenama i na kraju
 let sc=1,yA=0,yB=0,po=1,xA=60,xB=600,top=760;
 if(t<2.6){const pa=ease(cl(t/0.7)),pb=ease(cl((t-0.25)/0.7));xA=60-200*(1-pa);xB=600+200*(1-pb);sc=0.98+0.02*Math.sin(t*3);yA=6*Math.sin(t*2.4);yB=6*Math.sin(t*2.4+1.5);
   $('pA').style.opacity=pa;$('pB').style.opacity=pb;}
 else if(t>=8.4&&t<10.9){po=1;sc=0.68;top=330;xA=170;xB=490;$('pA').style.opacity=1;$('pB').style.opacity=1;}
 else po=0;
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 if(!po){$('pA').style.opacity=0;$('pB').style.opacity=0;}
 [['pA',xA,yA,-4],['pB',xB,yB,4]].forEach(([id,x,y,r])=>{const e=$(id);e.style.left=x+'px';e.style.top=top+'px';
   e.style.transform=`translateY(${y}px) scale(${sc}) rotate(${t<2.6?r*(1-ease(cl(t/0.9))):0}deg)`;
   e.querySelector('.lb').style.opacity=t<2.6?cl((t-0.9)/0.2):(t>=8.4&&t<10.9?1:0);});
 $('vs').style.opacity=t<2.6?cl((t-0.7)/0.2):0;$('vs').style.transform=`scale(${0.5+0.5*back(cl((t-0.7)/0.35))})`;
 [['gA',xA-50,top],['gB',xB-50,top]].forEach(([id,x,y])=>{const g=$(id);g.style.left=x+'px';g.style.top=y+'px';g.style.opacity=(t<2.6?1:0)*(0.6+0.4*Math.sin(t*4));});
 // kartica sa šemom
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 $('tag').style.opacity=co;
 const inB=t>=5.4;const wipe=cl((t-5.4)/0.35);
 $('sA').style.opacity=inB?1-wipe:1;$('sB').style.opacity=inB?wipe:0;$('sB').style.clipPath=`circle(${wipe*90}% at 50% 50%)`;
 // A: kablovi se iscrtavaju, tačke putuju
 PA.forEach((p,i)=>{if(p.getAttribute('opacity')==='0')return;const L=p.getTotalLength();const d=cl((t-2.9-i*0.15)/0.45);
   p.setAttribute('stroke','#6cc08f');p.setAttribute('stroke-dasharray',L);p.setAttribute('stroke-dashoffset',L*(1-d));});
 document.querySelectorAll('.dt').forEach(c=>{const p=PA[+c.dataset.p];const L=p.getTotalLength();const on=t>3.5&&t<5.6;
   const f=((t*0.8+(+c.dataset.k)/3)%1);const pt=p.getPointAtLength(L*f);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);c.setAttribute('opacity',on?1:0);});
 $('lblA').setAttribute('opacity',cl((t-3.6)/0.2));$('lblA').setAttribute('transform',`translate(0 ${(1-back(cl((t-3.6)/0.35)))*30})`);
 // B: svič iskače, pa kablovi
 $('swB').setAttribute('opacity',cl((t-5.75)/0.15));
 $('cabB').setAttribute('opacity',cl((t-6.1)/0.2));$('cabB').setAttribute('stroke-dasharray','18 12');$('cabB').setAttribute('stroke-dashoffset',-t*50);
 $('lblB').setAttribute('opacity',cl((t-6.5)/0.2));$('lblB').setAttribute('transform',`translate(0 ${(1-back(cl((t-6.5)/0.35)))*30})`);
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'112px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(220px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // krajnja kartica
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const ei=document.querySelector('#end .im');const eq=back(cl((t-11.0)/0.5));ei.style.transform=`translateY(${(1-cl(eq))*40}px) scale(${0.85+0.15*eq+0.01*Math.sin(t*3)})`;
 $('pv').textContent=Math.round(PRICE*ease(cl((t-11.2)/0.9))).toLocaleString('de-DE');
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=document.querySelector('#end .nm');let fs=80;e.style.fontSize=fs+'px';while(e.scrollWidth>1000&&fs>40){fs-=2;e.style.fontSize=fs+'px';}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
