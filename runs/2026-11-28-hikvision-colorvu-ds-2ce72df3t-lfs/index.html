<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
#bar{position:absolute;left:0;top:0;height:10px;background:#6cc08f;z-index:30}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:110px;line-height:1.04;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:54px;line-height:1.18;color:#cfe9da;margin-top:24px}
#h .b em{font-style:normal;color:#6cc08f}
.tile{position:absolute;transform-origin:50% 50%}
.tile img{width:100%;height:100%;filter:drop-shadow(0 40px 60px rgba(0,0,0,.5))}
#prod{left:330px;top:760px;width:420px;height:420px}
#glow{position:absolute;left:240px;top:670px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#6cc08f 0%,transparent 65%);opacity:0}
#cnt{position:absolute;top:470px;left:0;right:0;display:flex;justify-content:center;z-index:8;opacity:0}
#cnt span{background:rgba(11,26,20,.8);border:3px solid #6cc08f;color:#fff;font-weight:700;font-size:40px;padding:10px 34px;border-radius:50px}
#cnt b{color:#6cc08f}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.tag{position:absolute;left:24px;top:22px;background:rgba(11,26,20,.85);color:#cfe9da;font-weight:700;font-size:28px;padding:6px 18px;border-radius:20px}
.ct{position:absolute;width:190px;height:190px;opacity:0}
.ct img{width:100%;height:100%;filter:drop-shadow(0 16px 26px rgba(0,0,0,.5))}
.ct b{position:absolute;left:50%;top:186px;transform:translateX(-50%);white-space:nowrap;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:30px;padding:4px 16px;border-radius:30px}
#scB{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
#scB svg{position:absolute;left:0;top:0}
#dvr{left:330px;top:740px;width:420px;height:420px}
#hdd{left:770px;top:920px;width:240px;height:240px}
#psu{position:absolute;left:80px;top:950px;width:230px;padding:20px 10px;border-radius:30px;background:#fff;text-align:center;color:#123528;font-weight:800;font-size:34px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
#psu small{display:block;font-weight:600;font-size:24px;color:#2f7a50}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:140px;line-height:1.04;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:42px;color:#2f7a50}
#end .sub s{color:#7a8f84}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .pr b{color:#6cc08f}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><style>
#stl{position:absolute;top:640px;left:0;right:0;text-align:center;font-weight:700;font-size:52px;color:#cfe9da;opacity:0;z-index:8;letter-spacing:1px}
#mini{position:absolute;left:60px;top:150px;width:200px;height:200px}
.bx{position:absolute;width:300px;height:150px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:46px}
.bx small{font-size:24px;font-weight:600}
#ok{left:620px;top:120px;background:#fff;color:#123528}
#no{left:620px;top:420px;background:rgba(255,255,255,.08);color:#cfe9da;border:3px dashed rgba(255,255,255,.35)}
.mark{position:absolute;right:-26px;top:-26px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;opacity:0}
#ok .mark{background:#6cc08f;color:#0b1a14}#no .mark{background:#ff8a80;color:#3a0b0b}
#cardB{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0a1712;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#cardB svg{position:absolute;left:0;top:0;width:980px;height:700px}
</style><body>
<div id="bg"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div id="grid"></div><div id="endbg"></div>
<div id="glow"></div>
<div id="card">
 <svg viewBox="0 0 980 700">
  <rect width="980" height="700" fill="#10291e"/>
  <path id="wire" d="M270 250 C420 250 460 195 620 195" fill="none" stroke="#6cc08f" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 18"/>
  <path id="wire2" d="M270 260 C420 260 460 495 620 495" fill="none" stroke="#ff8a80" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 16" opacity="0"/>
  <text x="440" y="640" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="32" fill="#cfe9da">koaksijalni kabl · bez PoE</text>
 </svg>
 <div class="tag" style="top:auto;bottom:22px;left:auto;right:24px">Primer</div>
 <div class="ct" id="mini" style="opacity:1"><img src="assets/prod.png"></div>
 <div class="bx" id="ok">DVR / XVR<small>HD-TVI snimač</small><div class="mark">✓</div></div>
 <div class="bx" id="no">NVR<small>IP snimač</small><div class="mark">✕</div></div>
</div>
<div id="cardB">
 <svg viewBox="0 0 980 700">
  <defs>
   <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
   <clipPath id="beam"><path id="beamP" d="M200 205 L200 205 L200 205Z"/></clipPath>
   <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe8" stop-opacity=".55"/><stop offset="1" stop-color="#fffbe8" stop-opacity=".05"/></linearGradient>
   <g id="yard">
    <rect width="980" height="700" fill="#0d1a2a"/>
    <g fill="#fff" opacity=".6"><circle cx="760" cy="70" r="3"/><circle cx="860" cy="120" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="910" cy="40" r="3"/></g>
    <circle cx="840" cy="90" r="30" fill="#e9f6ef" opacity=".7"/>
    <rect y="430" width="980" height="270" fill="#203a2a"/>
    <rect x="40" y="250" width="260" height="190" fill="#c9d3cc"/><path d="M20 260 L170 150 L320 260Z" fill="#2f7a50"/>
    <rect x="200" y="330" width="60" height="110" fill="#8a6a4a"/>
    <path d="M330 700 L300 445 L360 445 L460 700Z" fill="#4a5a52"/>
    <g transform="translate(560 500)"><rect width="230" height="80" rx="24" fill="#d9483b"/><rect x="45" y="-46" width="140" height="56" rx="20" fill="#d9483b"/><rect x="62" y="-36" width="46" height="34" rx="6" fill="#9fd0ff"/><rect x="122" y="-36" width="46" height="34" rx="6" fill="#9fd0ff"/><circle cx="52" cy="82" r="24" fill="#111"/><circle cx="178" cy="82" r="24" fill="#111"/></g>
    <g transform="translate(430 600)"><circle cx="0" cy="-130" r="24" fill="#f1c7a0"/><path d="M-30 -100 Q0 -112 30 -100 L26 -30 L-26 -30Z" fill="#f2b632"/><rect x="-24" y="-32" width="18" height="34" fill="#2c4f8f"/><rect x="6" y="-32" width="18" height="34" fill="#2c4f8f"/></g>
    <rect x="880" y="300" width="22" height="140" fill="#6b4e33"/><circle cx="890" cy="280" r="70" fill="#2f7a50"/>
   </g>
  </defs>
  <g filter="url(#gray)" opacity=".55"><use href="#yard"/></g>
  <g clip-path="url(#beam)"><use href="#yard"/><path id="beamF" fill="url(#lit)"/></g>
  <g transform="translate(200 205)"><circle r="18" fill="#fff"/><circle r="8" fill="#f2d16b"/></g>
  <text id="bw" x="940" y="660" text-anchor="end" font-family="Poppins" font-weight="700" font-size="30" fill="#cfe9da">obična IC kamera: crno-belo</text>
 </svg>
 <div class="tag">Primer</div>
</div>
<div class="tile" id="prod"><img src="assets/prod.png"></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="stl">Pre kupovine proveri:</div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">COLORVU KAMERA · BOJA NOĆU</div><div class="nm">Hikvision DS-2CE72DF3T-LFS</div><div class="sub">Belo svetlo + IR do 40 m · mikrofon</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b></div></div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'<em>ColorVu</em> kamera<br>na NVR? <em>Ne.</em>','Ide koaksijalnim kablom<br>na <em>DVR ili XVR</em>.'],
 [2.6,5.4,'Snimač mora biti<br><em>DVR ili XVR</em>.',''],
 [5.4,8.4,'Noću slika<br>ostaje <em>u boji</em>.',''],
];
const CH=[[3.0,5.4,'<b>HD-TVI</b> · 2 MP · 2.8 mm'],[5.8,8.4,'<b>Belo svetlo + IR</b> do 40 m']];
const ST=[[8.4,9.2,'Snimač:<br><em>DVR / XVR</em>'],[9.2,10.0,'Kabl:<br><em>koaksijalni</em>'],[10.0,10.9,'Napajanje:<br><em>12 V</em>']];
function jolt(t){let s=1;CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)s*=1+0.06*(1-d/0.25)});return s}
window.render=function(t){
 $('bar').style.width=(t/14*1080)+'px';
 $('b1').style.transform=`translate(${100+120*Math.sin(t*0.7)}px,${300+80*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.6)}px,${1200+90*Math.sin(t*0.8)}px)`;
 $('grid').style.backgroundPosition=`0 ${t*18}px`;
 const J=jolt(t);
 let sc=1,y=0,rot=0,po=1;
 if(t<2.6){const p=ease(cl(t/0.9));sc=1.22-0.1*p+0.015*Math.sin(t*3);y=60-60*p;rot=-8+8*p+1.5*Math.sin(t*2);}
 else if(t<10.9){po=0;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.8+0.4*p;y=40;po=cl((t-10.9)/0.2);rot=0.8*Math.sin(t*2);}
 $('prod').style.opacity=po;$('prod').style.transform=`translateY(${y}px) scale(${sc*J}) rotate(${rot}deg)`;
 $('glow').style.opacity=t<2.6?0.35+0.15*Math.sin(t*5):0;
 // scena A: koaksijal -> DVR/XVR, NVR ne
 const co=t>=2.6&&t<5.4?ease(cl((t-2.6)/0.3)):0;$('card').style.opacity=co;$('card').style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 $('mini').style.transform=`scale(${J}) translateY(${5*Math.sin(t*3)}px)`;
 $('wire').style.strokeDashoffset=-t*90;$('wire').style.opacity=cl((t-2.9)/0.3);
 $('wire2').setAttribute('opacity',t>=3.6?0.5*cl((t-3.6)/0.3):0);
 const okq=back(cl((t-3.2)/0.35));$('ok').querySelector('.mark').style.opacity=cl((t-3.2)/0.1);$('ok').querySelector('.mark').style.transform=`scale(${okq})`;
 const noq=back(cl((t-3.9)/0.35));$('no').querySelector('.mark').style.opacity=cl((t-3.9)/0.1);$('no').querySelector('.mark').style.transform=`scale(${noq})`;
 $('ok').style.transform=`scale(${1+0.05*Math.max(0,1-Math.abs(t-3.3)/0.2)})`;$('no').style.opacity=t>=3.9?0.55:1;
 // scena B: belo svetlo boji scenu
 const bo=t>=5.4&&t<8.4?ease(cl((t-5.4)/0.3)):0;$('cardB').style.opacity=bo;$('cardB').style.transform=`translateY(${(1-bo)*120}px)`;
 const s=ease(cl((t-5.9)/0.9));const sw=12*Math.sin(t*1.5);
 const L=[200+ (-260+sw)*s*2.4, 205+520*s*1.0],R=[200+(820+sw)*s, 205+560*s*1.0];
 const d=`M200 205 L${200+(-40+sw)*s*3} ${205+500*s} L${200+(780+sw)*s} ${205+500*s} L${200+(760+sw)*s} ${205+200*s}Z`;
 $('beamP').setAttribute('d',d);$('beamF').setAttribute('d',d);
 $('bw').setAttribute('opacity',t<6.1?1:cl(1-(t-6.1)/0.3));
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'108px':'86px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 $('stl').style.opacity=t>=8.4&&t<10.9?cl((t-8.4)/0.15):0;
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(60px) scale(${1.5-0.5*ease(p)}) rotate(${(1-ease(p))*-4}deg)`;}
 else se.style.opacity=0;
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 $('end').querySelector('.pr>span').style.transform=`scale(${t>12.1?1+0.03*Math.sin((t-12.1)*Math.PI*2):1})`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=document.querySelector('#end .nm');let s=80;while(e.scrollWidth>1000&&s>40){s-=2;e.style.fontSize=s+'px'}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0)});
</script></body></html>
