<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#bar{position:absolute;top:0;left:0;height:8px;background:#6cc08f;z-index:10}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.02;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:280px;top:760px;width:520px;height:520px;transform-origin:50% 50%}
#prod img{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 40px 50px rgba(0,0,0,.5))}
#prod svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#glow{position:absolute;left:230px;top:780px;width:620px;height:480px;border-radius:50%;background:radial-gradient(closest-side,rgba(108,192,143,.5),rgba(108,192,143,0))}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
#tag{position:absolute;left:26px;top:22px;background:rgba(11,26,20,.8);color:#cfe9da;font-weight:700;font-size:28px;padding:6px 18px;border-radius:20px;opacity:0}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .im{position:absolute;left:260px;top:620px;width:560px;height:560px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.18))}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}

#prod{left:290px;top:800px;width:500px;height:500px}
#glow{left:220px;top:820px;width:640px;height:480px}
#xn{position:absolute;left:0;right:0;top:1360px;display:flex;justify-content:center;gap:28px;z-index:8;opacity:0}
#xn span{font-weight:800;font-size:44px;padding:14px 34px;border-radius:44px;white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#xn .no{background:#0b1a14;color:#ff8a80;border:3px solid #ff8a80;text-decoration:line-through}
#xn .ok{background:#6cc08f;color:#0b1a14}
#pk{position:absolute;left:0;right:0;top:800px;text-align:center;font-weight:700;font-size:52px;color:#cfe9da;opacity:0;z-index:8}
#stamp div{font-size:138px}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1" style="width:520px;height:520px;background:#2f7a50"></div>
<div class="blob" id="b2" style="width:420px;height:420px;background:#439665"></div>
<div id="endbg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="dome"><path d="M-34 0 A34 34 0 0 1 34 0Z" fill="#fff"/><rect x="-40" y="-6" width="80" height="10" rx="4" fill="#e9efe9"/><circle cx="0" cy="12" r="16" fill="#1c1c1c"/><circle cx="0" cy="12" r="7" fill="#3a3a3a"/></g>
<radialGradient id="led" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(872 220) scale(900)"><stop offset="0" stop-color="#fff8e1" stop-opacity=".7"/><stop offset="1" stop-color="#fff8e1" stop-opacity="0"/></radialGradient>
<clipPath id="beam"><path d="M872 214 L40 360 L40 700 L720 700 L878 236Z"/></clipPath>
</defs></svg>
<div id="card">
 <!-- scena A: kamera -> koaksijalni kabl -> DVR/XVR; NVR i PoE svič precrtani -->
 <svg id="sA" viewBox="0 0 980 700">
  <rect width="980" height="700" fill="#173a2b"/>
  <rect x="0" y="0" width="300" height="700" fill="#1d4a35"/>
  <g transform="translate(150 150) rotate(180)"><use href="#dome"/></g>
  <text x="185" y="232" text-anchor="start" fill="#cfe9da" font-family="Poppins" font-weight="800" font-size="26">HD-TVI kamera</text>
  <path id="coax" d="M150 180 C150 420 420 420 600 420" fill="none" stroke="#2b2b2b" stroke-width="16" stroke-linecap="round"/>
  <path id="coaxS" d="M150 180 C150 420 420 420 600 420" fill="none" stroke="#6cc08f" stroke-width="6" stroke-linecap="round" stroke-dasharray="20 22"/>
  <g id="coaxL" opacity="0"><rect x="250" y="440" width="270" height="48" rx="24" fill="#6cc08f"/><text x="385" y="474" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="26">koaksijalni kabl</text></g>
  <g id="dvr"><rect x="600" y="370" width="300" height="100" rx="16" fill="#f4f7f5"/><circle cx="625" cy="395" r="6" fill="#6cc08f"/><circle cx="645" cy="395" r="6" fill="#6cc08f"/>
   <text x="750" y="438" text-anchor="middle" fill="#123528" font-family="Poppins" font-weight="800" font-size="40">DVR / XVR</text></g>
  <g id="ok" opacity="0" transform="translate(900 360)"><circle r="34" fill="#6cc08f"/><path d="M-15 0 L-4 12 L16 -12" stroke="#0b1a14" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g id="nvr" opacity="0"><rect x="400" y="96" width="220" height="90" rx="16" fill="#0b1a14" stroke="#ff8a80" stroke-width="3"/><text x="510" y="155" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="36">NVR</text>
   <rect x="650" y="96" width="270" height="90" rx="16" fill="#0b1a14" stroke="#ff8a80" stroke-width="3"/><text x="785" y="155" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="34">PoE svič</text>
   <line id="x1" x1="390" y1="141" x2="930" y2="141" stroke="#ff8a80" stroke-width="9" stroke-linecap="round"/></g>
 </svg>
 <!-- scena B: noć, belo LED svetlo, u snopu slika u boji do 20 m -->
 <svg id="sB" viewBox="0 0 980 700" style="opacity:0">
  <rect width="980" height="700" fill="#0c1813"/>
  <g fill="#fff" opacity=".45"><circle cx="300" cy="70" r="3"/><circle cx="520" cy="50" r="2"/><circle cx="640" cy="120" r="3"/><circle cx="420" cy="140" r="2"/></g>
  <rect y="470" width="980" height="230" fill="#141f1a"/>
  <rect x="900" y="160" width="80" height="540" fill="#2a3b33"/>
  <g transform="translate(884 214) rotate(55)"><use href="#dome"/></g>
  <!-- siva (bez svetla) verzija -->
  <g id="gray"><rect x="120" y="500" width="220" height="80" rx="24" fill="#555"/><rect x="160" y="460" width="140" height="60" rx="18" fill="#4a4a4a"/><circle cx="170" cy="584" r="24" fill="#222"/><circle cx="300" cy="584" r="24" fill="#222"/>
   <rect x="470" y="520" width="90" height="70" fill="#5c5c5c"/><circle cx="485" cy="510" r="22" fill="#6a6a6a"/><circle cx="545" cy="505" r="26" fill="#6a6a6a"/></g>
  <!-- u boji, vidi se samo u snopu -->
  <g id="colr" clip-path="url(#beam)"><rect width="980" height="700" fill="url(#led)"/>
   <rect x="120" y="500" width="220" height="80" rx="24" fill="#d64545"/><rect x="160" y="460" width="140" height="60" rx="18" fill="#c03a3a"/><rect x="178" y="470" width="50" height="38" rx="8" fill="#bfe3ff"/><rect x="236" y="470" width="50" height="38" rx="8" fill="#bfe3ff"/><circle cx="170" cy="584" r="24" fill="#222"/><circle cx="300" cy="584" r="24" fill="#222"/>
   <rect x="470" y="520" width="90" height="70" fill="#b5651d"/><circle cx="485" cy="510" r="22" fill="#e94f8a"/><circle cx="545" cy="505" r="26" fill="#ffd23f"/><circle cx="515" cy="492" r="18" fill="#7c4dff"/></g>
  <g id="ruler" opacity="0"><line x1="80" y1="650" x2="860" y2="650" stroke="#6cc08f" stroke-width="6"/><line x1="80" y1="630" x2="80" y2="670" stroke="#6cc08f" stroke-width="6"/><line x1="860" y1="630" x2="860" y2="670" stroke="#6cc08f" stroke-width="6"/>
   <rect x="660" y="606" width="160" height="56" rx="28" fill="#6cc08f"/><text id="rl" x="740" y="646" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="34">20 m</text></g>
 </svg>
 <div id="tag">Primer</div>
</div>
<div id="glow"></div>
<div id="prod"><img src="assets/prod.png"></div>
<div id="xn"><span class="no">NVR</span><span class="ok">DVR / XVR</span></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="bar"></div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="pk">Pre kupovine proveri:</div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">COLORVU TURRET KAMERA · 2 MP</div><img class="im" src="assets/prod.png"><div class="nm">Hikvision DS-2CE70DF3T-LMFS</div><div class="sub">Noću u boji do 20 m</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Greška: <em>analogna</em><br>kamera na NVR.','<em>Kamera u boji noću</em><br>ide na DVR ili XVR.'],
 [2.6,5.4,'Preko <em>koaksa</em><br>do DVR-a.',''],
 [5.4,8.4,'Noću u <em>boji</em><br>do 20 m.',''],
];
const CH=[[3.0,5.4,'NVR i PoE svič: <b>ne trebaju</b>'],[5.8,8.4,'<b>ColorVu:</b> belo LED i IC']];
const ST=[[8.4,9.2,'<em>DVR</em><br>ili XVR.'],[9.2,10.0,'Napajanje<br><em>12 VDC</em>.'],[10.0,10.9,'Kućište<br><em>IP67</em>.']];
window.render=function(t){
 $('bar').style.width=(1080*t/14)+'px';
 $('b1').style.transform=`translate(${120+120*Math.sin(t*0.7)}px,${300+90*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.6)}px,${1200+120*Math.sin(t*0.8)}px)`;
 // proizvod
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.94+0.06*p+0.012*Math.sin(t*3);y=70*(1-p);rot=6-6*p;ry=-(1-p)*35;}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.62+0.012*Math.sin(t*3);y=-470+8*Math.sin(t*2.2);}
 else po=0;
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 $('prod').style.opacity=po;$('prod').style.transform=`translateY(${y}px) perspective(1400px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?1:0)*(0.6+0.4*Math.sin(t*4));
 // hook: NVR precrtan, DVR/XVR
 const xq=back(cl((t-1.2)/0.35));$('xn').style.opacity=t<2.6?cl((t-1.2)/0.12):0;$('xn').style.transform=`scale(${0.7+0.3*xq})`;
 // kartica
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 $('tag').style.opacity=co;
 const inB=t>=5.4;const wipe=cl((t-5.4)/0.35);
 $('sA').style.opacity=inB?1-wipe:1;$('sB').style.opacity=inB?wipe:0;$('sB').style.clipPath=`inset(0 0 ${100-wipe*100}% 0)`;
 // A: kabl se iscrta, signal teče, DVR potvrda, NVR i PoE svič precrtani
 const cq=ease(cl((t-2.8)/0.6));['coax','coaxS'].forEach(id=>{$(id).setAttribute('pathLength','1');});
 $('coax').setAttribute('stroke-dasharray',`${cq} 1`);
 $('coaxS').setAttribute('stroke-dasharray','0.03 0.04');$('coaxS').setAttribute('stroke-dashoffset',-t*0.25);$('coaxS').setAttribute('opacity',cl((t-3.4)/0.2));
 $('coaxL').setAttribute('opacity',cl((t-3.3)/0.2));
 const ok=back(cl((t-3.6)/0.3));$('ok').setAttribute('opacity',cl((t-3.6)/0.1));$('ok').setAttribute('transform',`translate(900 360) scale(${ok})`);
 $('nvr').setAttribute('opacity',cl((t-4.0)/0.2));
 $('x1').setAttribute('x2',390+540*ease(cl((t-4.3)/0.35)));
 $('dvr').setAttribute('transform',`translate(0 ${-3*Math.abs(Math.sin(t*2.5))})`);
 // B: snop se pali, boje se otkrivaju, lenjir 20 m
 const lq=ease(cl((t-5.8)/0.5));$('colr').setAttribute('opacity',lq*(0.9+0.1*Math.sin(t*6)));
 $('ruler').setAttribute('opacity',cl((t-6.4)/0.2));$('rl').textContent=Math.round(20*ease(cl((t-6.4)/0.8)))+' m';
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'94px':'88px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati + „Pre kupovine proveri:“
 $('pk').style.opacity=t>=8.4&&t<10.9?cl((t-8.45)/0.15):0;
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(220px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // krajnja kartica
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const ei=document.querySelector('#end .im');const eq=back(cl((t-11.0)/0.5));ei.style.transform=`translateY(${(1-cl(eq))*40}px) scale(${0.85+0.15*eq+0.01*Math.sin(t*3)})`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=document.querySelector('#end .nm');let fs=80;e.style.fontSize=fs+'px';while(e.scrollWidth>1000&&fs>40){fs-=2;e.style.fontSize=fs+'px';}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
