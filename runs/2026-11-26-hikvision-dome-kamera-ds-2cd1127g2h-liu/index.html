<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#6cc08f;opacity:.35}
#bar{position:absolute;top:0;left:0;height:10px;background:#6cc08f;z-index:12}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:92px;line-height:1.06;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:52px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:260px;top:760px;width:560px;height:560px;transform-origin:50% 50%;z-index:6}
#prod img{width:100%;height:100%;border-radius:44px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
#glow{position:absolute;left:140px;top:640px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,#6cc08f55 0%,transparent 65%);z-index:5}
#tag{position:absolute;left:700px;top:720px;z-index:7;opacity:0}
#tag span{display:inline-block;white-space:nowrap;background:#fff;color:#123528;font-weight:800;font-size:46px;padding:12px 30px;border-radius:40px;border:5px dashed #2f7a50;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#who{position:absolute;top:470px;left:0;right:0;display:flex;justify-content:center;z-index:8;opacity:0}
#who span{background:#6cc08f;color:#0b1a14;font-weight:800;font-size:40px;padding:10px 30px;border-radius:40px;letter-spacing:2px}
#card{position:absolute;left:50px;top:600px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.pr-note{position:absolute;right:28px;bottom:22px;color:#cfe9da;font-weight:600;font-size:26px;opacity:.75}
#chip{position:absolute;top:1340px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:44px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:130px;line-height:1.04;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#chk{position:absolute;top:640px;left:0;right:0;text-align:center;font-weight:700;font-size:54px;letter-spacing:3px;color:#cfe9da;opacity:0;z-index:8}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1465px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:60px;padding:18px 50px;border-radius:70px}
#end .cta{position:absolute;top:1595px;left:0;right:0;font-weight:700;font-size:40px;color:#123528;line-height:1.3}
#end .cta b{color:#2f7a50}
#badge{position:absolute;left:790px;top:400px;width:190px;height:190px;border-radius:50%;background:#2f7a50;color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="dots"></div>
<div id="endbg"></div>
<div id="glow"></div>
<div id="card">
 <svg viewBox="0 0 980 700">
  <!-- scena A: ulaz u zgradu, lopta udara u dome kameru (ilustracija) -->
  <g id="sA">
   <rect width="980" height="700" fill="#1b4636"/>
   <rect x="0" y="0" width="980" height="70" fill="#2a5a45"/>
   <rect x="0" y="600" width="980" height="100" fill="#14291f"/>
   <!-- vrata zgrade -->
   <rect x="80" y="210" width="300" height="390" rx="10" fill="#0f2a1f" stroke="#6cc08f" stroke-width="5"/>
   <line x1="230" y1="210" x2="230" y2="600" stroke="#6cc08f" stroke-width="4"/>
   <rect x="250" y="400" width="14" height="60" rx="6" fill="#cfe9da"/><rect x="196" y="400" width="14" height="60" rx="6" fill="#cfe9da"/>
   <rect x="110" y="150" width="240" height="44" rx="10" fill="#2f7a50"/><text x="230" y="182" fill="#fff" font-family="Poppins" font-weight="800" font-size="26" text-anchor="middle">ULAZ</text>
   <!-- dome kamera na plafonu -->
   <g id="domeA" transform="translate(640 70)">
    <rect x="-80" y="0" width="160" height="26" rx="8" fill="#e9efe9"/>
    <path d="M-66 26 A66 66 0 0 0 66 26 Z" fill="#f4f4ef"/>
    <path d="M-44 30 A44 44 0 0 0 44 30 Z" fill="#1d2a24"/>
    <circle cx="0" cy="50" r="13" fill="#123528"/>
   </g>
   <polygon points="640,130 380,600 900,600" fill="#6cc08f" opacity=".10"/>
   <!-- lopta -->
   <g id="ball"><circle r="38" fill="#f4f4ef"/><path d="M-12 -14 L12 -14 L18 8 L0 22 L-18 8 Z" fill="#123528"/></g>
   <g id="hit" opacity="0" transform="translate(640 150)"><path d="M0 -50 L12 -16 L48 -20 L20 4 L36 38 L0 18 L-36 38 L-20 4 L-48 -20 L-12 -16 Z" fill="#fff6d6"/></g>
   <g id="ik" opacity="0"><rect x="730" y="230" width="200" height="64" rx="32" fill="#6cc08f"/><text x="830" y="274" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="34" text-anchor="middle">IK08</text></g>
   <g id="okA" opacity="0"><circle cx="830" cy="360" r="40" fill="#6cc08f"/><path d="M810 360 L825 376 L852 344" stroke="#0b1a14" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- scena B: garaža u slabom svetlu, belo svetlo do 30 m, auto u boji (ilustracija) -->
  <g id="sB" opacity="0">
   <rect width="980" height="700" fill="#0c1d16"/>
   <rect x="0" y="0" width="980" height="60" fill="#14291f"/>
   <rect x="0" y="560" width="980" height="140" fill="#14291f"/>
   <g stroke="#2f7a50" stroke-width="6" stroke-dasharray="40 30"><line x1="300" y1="640" x2="300" y2="700"/><line x1="660" y1="640" x2="660" y2="700"/></g>
   <rect x="90" y="120" width="26" height="440" fill="#1b4636"/><rect x="870" y="120" width="26" height="440" fill="#1b4636"/>
   <g transform="translate(130 60)">
    <rect x="-60" y="0" width="120" height="20" rx="6" fill="#e9efe9"/>
    <path d="M-50 20 A50 50 0 0 0 50 20 Z" fill="#f4f4ef"/><circle cx="8" cy="40" r="10" fill="#123528"/>
   </g>
   <polygon id="beam" points="140,110 960,380 960,600 140,130" fill="#fff6d6" opacity=".22"/>
   <g id="colorObj">
    <rect x="520" y="420" width="300" height="110" rx="30" fill="#3b7dd8"/><rect x="570" y="370" width="200" height="70" rx="22" fill="#5b97e6"/>
    <rect x="590" y="382" width="74" height="46" rx="10" fill="#cfe9f7"/><rect x="676" y="382" width="74" height="46" rx="10" fill="#cfe9f7"/>
    <circle cx="590" cy="535" r="32" fill="#1a1a1a"/><circle cx="750" cy="535" r="32" fill="#1a1a1a"/>
    <rect x="800" y="450" width="24" height="18" rx="6" fill="#ffd166"/>
   </g>
   <g id="m30" opacity="0"><line x1="140" y1="610" x2="900" y2="610" stroke="#6cc08f" stroke-width="5"/><line x1="140" y1="595" x2="140" y2="625" stroke="#6cc08f" stroke-width="5"/><line x1="900" y1="595" x2="900" y2="625" stroke="#6cc08f" stroke-width="5"/><rect x="440" y="628" width="160" height="50" rx="25" fill="#6cc08f"/><text x="520" y="664" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="30" text-anchor="middle">do 30 m</text></g>
   <g id="bw" opacity="0"><rect x="560" y="90" width="340" height="56" rx="28" fill="#6cc08f"/><text x="730" y="128" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28" text-anchor="middle">Boja i noću</text></g>
  </g>
 </svg>
 <div class="pr-note">Primer</div>
</div>
<div id="prod"><img src="assets/prod.png"></div>
<div id="tag"><span>IK08</span></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="who"><span></span></div>
<div id="chip"><span></span></div>
<div id="chk">IDEALNA I ZA:</div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">IP DOME KAMERA · COLORVU · 2 MP</div><div class="nm" id="nm">Hikvision DS-2CD1127G2H-LIU</div><div class="sub">Otporna na udarac i vodu</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b><br><span style="font-weight:600;color:#2f7a50">super-vision.rs</span></div></div>
<div id="endimg" style="position:absolute;left:240px;top:440px;width:600px;height:600px;z-index:7;opacity:0"><img src="assets/prod.png" style="width:100%;height:100%;border-radius:40px;box-shadow:0 30px 60px rgba(18,53,40,.25)"></div>
<div id="badge">IK08</div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Kamera koja<br><em>trpi udarac</em>','<em>Kamera za ulaz u zgradu</em> i garažu'],
 [2.6,5.4,'Lopta. <em>Opet.</em><br>Kućište IK08.',''],
 [5.4,8.4,'Boja i u<br><em>slabom svetlu</em>',''],
];
const WHO=[[2.6,5.4,'ULAZ U ZGRADU'],[5.4,8.4,'GARAŽA']];
const CH=[[3.2,5.4,'IP67 i <b>IK08</b> kućište'],[5.8,8.4,'Belo svetlo <b>do 30 m</b>']];
const ST=[[8.4,9.2,'<em>Hodnici</em>'],[9.2,10.0,'<em>Prodavnice</em>'],[10.0,10.9,'<em>Škole</em>']];
(function(){let d='';for(let i=0;i<18;i++)d+=`<div class="dot" id="d${i}"></div>`;$('dots').innerHTML=d;})();
function fitName(){const n=$('nm');let f=80;n.style.fontSize=f+'px';while(n.scrollWidth>1000&&f>40){f-=2;n.style.fontSize=f+'px';}}
window.render=function(t){
 $('bar').style.width=(1080*cl(t/14))+'px';
 $('b1').style.transform=`translate(${-120+80*Math.sin(t*0.6)}px,${200+60*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${680+70*Math.cos(t*0.7)}px,${1250+80*Math.sin(t*0.4)}px)`;
 for(let i=0;i<18;i++){const e=$('d'+i);const sx=(i*137)%1000+40,sy=(i*311)%1800;let yy=(sy-t*40*(1+i%3))%1900;if(yy<0)yy+=1900;e.style.transform=`translate(${sx+20*Math.sin(t+i)}px,${yy}px)`;e.style.opacity=t>=10.9?0:.3;}
 // proizvod 560 px, scale najviše 1.12 => 627 px <= MAX_PX 985
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.82+0.18*p+0.012*Math.sin(t*3);y=70-70*p+8*Math.sin(t*2.2);rot=-6+6*p;ry=34-34*p;}
 else po=0;
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc=Math.min(1.12,sc*(1+0.06*(1-d/0.25)))});
 $('prod').style.opacity=po;$('prod').style.transform=`translate(0px,${y}px) perspective(1200px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?0.7+0.3*Math.sin(t*5):0);
 $('glow').style.transform=`translateY(${y}px) scale(${0.9+0.08*Math.sin(t*4)})`;
 const tg=$('tag');const tv=t<2.6?back(cl((t-1.2)/0.35)):0;tg.style.opacity=cl(tv*3);tg.style.transform=`scale(${0.5+0.5*tv}) rotate(${-6+3*Math.sin(t*6)}deg)`;
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 const b=t>=5.4;$('sA').setAttribute('opacity',b?0:1);$('sB').setAttribute('opacity',b?1:0);
 // A: lopta leti ka kameri, udar, odbija se; IK08 i kvačica
 const la=t-2.6;let bx,by,hitv=0;
 if(la<0.9){const q=cl(la/0.9);bx=120+520*q;by=560-470*q+(-120*Math.sin(Math.PI*q));}
 else {const q=cl((la-0.9)/1.0);bx=640-380*q;by=150+420*q*q;}
 $('ball').setAttribute('transform',`translate(${bx} ${by}) rotate(${la*400})`);
 const hd=la-0.9;hitv=hd>=0&&hd<0.35?1-hd/0.35:0;$('hit').setAttribute('opacity',hitv);
 $('hit').setAttribute('transform',`translate(640 150) scale(${0.6+0.8*(1-hitv)})`);
 const shake=hd>=0&&hd<0.3?6*Math.sin(hd*80)*(1-hd/0.3):0;$('domeA').setAttribute('transform',`translate(${640+shake} 70)`);
 const iq=back(cl((la-1.2)/0.35));$('ik').setAttribute('opacity',cl((la-1.2)/0.12));$('ik').setAttribute('transform',`translate(830 262) scale(${cl(iq,0,1.2)}) translate(-830 -262)`);
 const oq=back(cl((la-1.6)/0.35));$('okA').setAttribute('opacity',cl((la-1.6)/0.12));$('okA').setAttribute('transform',`translate(830 360) scale(${cl(oq,0,1.2)}) translate(-830 -360)`);
 // B: snop se pali, auto dobija boju, kota 30 m
 const lb=t-5.4;const bm=ease(cl((lb-0.3)/0.5));$('beam').setAttribute('opacity',(0.05+0.2*bm)*(1+0.08*Math.sin(t*9)));
 $('colorObj').style.filter=`grayscale(${1-ease(cl((lb-0.7)/0.6))}) brightness(${0.45+0.55*bm})`;
 $('m30').setAttribute('opacity',cl((lb-1.1)/0.3));
 const wq=back(cl((lb-1.4)/0.35));$('bw').setAttribute('opacity',cl((lb-1.4)/0.12));$('bw').setAttribute('transform',`translate(730 118) scale(${cl(wq,0,1.2)}) translate(-730 -118)`);
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.35)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.15+0.4):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'100px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 const w=WHO.find(x=>t>=x[0]&&t<x[1]);const we=$('who');
 if(w){we.querySelector('span').textContent=w[2];const p=back(cl((t-w[0]-0.1)/0.3));we.style.opacity=cl((t-w[0]-0.1)/0.1);we.style.transform=`scale(${cl(p,0,1.2)})`;}else we.style.opacity=0;
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(120px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 const ck=$('chk');ck.style.opacity=(t>=8.4&&t<10.9)?cl((t-8.4)/0.15):0;
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 // krajnja slika 600 px, scale najviše 1.04 => 624 px <= MAX_PX
 const eq=back(cl((t-10.95)/0.5));const ei=$('endimg');ei.style.opacity=t>=10.9?cl((t-10.9)/0.2):0;ei.style.transform=`translateY(${(1-cl(eq))*60+6*Math.sin(t*2)}px) scale(${Math.min(1.04,0.9+0.1*cl(eq,0,1.1))})`;
 const bq=back(cl((t-11.6)/0.4));$('badge').style.opacity=t>=10.9?cl(bq):0;$('badge').style.transform=`scale(${cl(bq,0,1.2)*(1+0.03*Math.sin(t*6))}) rotate(${-10+4*Math.sin(t*2)}deg)`;
 const pb=document.querySelector('#end .pr>span');pb.style.transform=`scale(${1+0.02*Math.sin(t*6)*cl(t-12.2)})`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fitName();render(0);});
</script></body></html>
