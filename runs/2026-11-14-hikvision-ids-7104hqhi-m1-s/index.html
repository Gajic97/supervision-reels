<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#bar{position:absolute;top:0;left:0;height:8px;background:#6cc08f;z-index:10}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.02;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:280px;top:760px;width:520px;height:520px;transform-origin:50% 50%}
#prod img{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 40px 50px rgba(0,0,0,.5))}
#prod svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#glow{position:absolute;left:230px;top:780px;width:620px;height:480px;border-radius:50%;background:radial-gradient(closest-side,rgba(108,192,143,.5),rgba(108,192,143,0))}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
#tag{position:absolute;left:26px;top:22px;background:rgba(11,26,20,.8);color:#cfe9da;font-weight:700;font-size:28px;padding:6px 18px;border-radius:20px;opacity:0}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .im{position:absolute;left:260px;top:620px;width:560px;height:560px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.18))}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}

#prod{left:250px;top:780px;width:580px;height:580px}
#glow{left:200px;top:800px;width:680px;height:520px}
.dt{position:absolute;z-index:8;font-weight:800;font-size:40px;padding:12px 30px;border-radius:40px;white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.35);opacity:0}
#d1{left:120px;top:1395px;background:#6cc08f;color:#0b1a14}
#d2{right:120px;top:1395px;background:#fff;color:#123528}
#stamp div{font-size:140px}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1" style="width:520px;height:520px;background:#2f7a50"></div>
<div class="blob" id="b2" style="width:420px;height:420px;background:#439665"></div>
<div id="endbg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="cam"><rect x="-30" y="-14" width="52" height="28" rx="12" fill="#fff"/><circle cx="-30" cy="0" r="10" fill="#0b1a14"/><rect x="16" y="-5" width="18" height="10" fill="#cfe9da"/><line x1="10" y1="-14" x2="14" y2="-40" stroke="#fff" stroke-width="5"/></g>
<linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b5e46"/><stop offset="1" stop-color="#3f7d5e"/></linearGradient>
<g id="bell"><path d="M-16 8 Q-16 -18 0 -20 Q16 -18 16 8 L20 12 L-20 12Z" fill="currentColor"/><circle cy="17" r="5" fill="currentColor"/></g>
</defs></svg>
<div id="card">
 <!-- scena A: dvorište sa drvećem; grana se njiše (bez alarma), čovek dobija okvir i obaveštenje -->
 <svg id="sA" viewBox="0 0 980 700">
  <rect width="980" height="700" fill="url(#day)"/>
  <rect y="520" width="980" height="180" fill="#244f3a"/>
  <rect x="40" y="250" width="300" height="270" fill="#e9efe9"/><path d="M15 262 L190 140 L365 262Z" fill="#2f7a50"/>
  <rect x="80" y="310" width="90" height="80" fill="#cfe2f0"/><rect x="220" y="380" width="80" height="140" fill="#8a6a4a"/>
  <g transform="translate(330 300) scale(-1 1)"><use href="#cam"/></g>
  <path d="M340 300 L980 200 L980 690 L340 312Z" fill="#e8f4ee" opacity=".08"/>
  <!-- drvo -->
  <rect x="770" y="300" width="34" height="230" fill="#6b4f36"/>
  <g id="branch" transform="translate(787 300)"><circle cx="-60" cy="-40" r="90" fill="#1f6b45"/><circle cx="50" cy="-70" r="80" fill="#2a7d52"/><circle cx="0" cy="-130" r="70" fill="#2f8a5a"/></g>
  <g id="bxT" opacity="0"><rect x="640" y="120" width="290" height="230" fill="none" stroke="#cfe9da" stroke-width="5" stroke-dasharray="14 10"/>
   <rect x="640" y="80" width="205" height="40" fill="#cfe9da"/><text x="652" y="110" fill="#123528" font-family="Poppins" font-weight="800" font-size="26">Pokret: grana</text>
   <g transform="translate(895 100)" color="#cfe9da"><use href="#bell"/><line x1="-24" y1="-24" x2="24" y2="24" stroke="#d64545" stroke-width="7" stroke-linecap="round"/></g></g>
  <!-- čovek -->
  <g id="man"><circle cx="0" cy="-150" r="26" fill="#f2d2b6"/><rect x="-28" y="-122" width="56" height="80" rx="18" fill="#cfe9da"/><rect x="-24" y="-46" width="20" height="62" rx="8" fill="#123528"/><rect x="4" y="-46" width="20" height="62" rx="8" fill="#123528"/></g>
  <g id="bxM" opacity="0"><rect id="bxMr" x="0" y="0" width="120" height="230" fill="none" stroke="#6cc08f" stroke-width="7"/>
   <rect id="bxMl" x="0" y="-44" width="150" height="44" fill="#6cc08f"/><text id="bxMt" x="0" y="0" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28">Čovek</text></g>
  <!-- obaveštenje na telefonu -->
  <g id="notif" opacity="0"><rect x="420" y="560" width="440" height="100" rx="26" fill="#fff"/>
   <g transform="translate(470 610)" color="#2f7a50"><use href="#bell"/></g>
   <text x="510" y="602" fill="#123528" font-family="Poppins" font-weight="800" font-size="30">Detektovan čovek</text>
   <text x="510" y="640" fill="#2f7a50" font-family="Poppins" font-weight="600" font-size="24">Kamera 1 · dvorište</text></g>
 </svg>
 <!-- scena B: manji objekat; mali snimač na polici, monitor sa 4 kanala -->
 <svg id="sB" viewBox="0 0 980 700" style="opacity:0">
  <rect width="980" height="700" fill="#173a2b"/>
  <rect y="540" width="980" height="160" fill="#10291e"/>
  <rect x="360" y="70" width="560" height="360" rx="18" fill="#0b1a14" stroke="#cfe9da" stroke-width="6"/>
  <rect x="610" y="430" width="60" height="60" fill="#cfe9da"/><rect x="560" y="486" width="160" height="16" rx="8" fill="#cfe9da"/>
  <g id="tiles"></g>
  <rect x="60" y="430" width="260" height="22" fill="#8a6a4a"/><rect x="80" y="452" width="16" height="88" fill="#6b4f36"/><rect x="284" y="452" width="16" height="88" fill="#6b4f36"/>
  <g id="mini"><rect x="100" y="370" width="180" height="60" rx="12" fill="#f4f7f5"/><circle cx="190" cy="400" r="16" fill="none" stroke="#c9d6cf" stroke-width="4"/><circle cx="122" cy="390" r="4" fill="#6cc08f"/></g>
  <path id="hdmi" d="M280 400 C400 400 420 520 560 494" fill="none" stroke="#6cc08f" stroke-width="7" stroke-linecap="round"/>
  <g id="hdl" opacity="0"><rect x="380" y="440" width="120" height="40" rx="20" fill="#6cc08f"/><text x="440" y="469" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="24">HDMI</text></g>
 </svg>
 <div id="tag">Primer</div>
</div>
<div id="glow"></div>
<div id="prod"><img src="assets/prod.png"></div>
<div class="dt" id="d1">Čovek</div><div class="dt" id="d2">Vozilo</div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="bar"></div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">DVR SNIMAČ · 4 KANALA</div><img class="im" src="assets/prod.png"><div class="nm">Hikvision iDS-7104HQHI-M1/S</div><div class="sub">AcuSense · ljudi i vozila</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Vlasnici <em>kuća</em><br>sa dvorištem:','<em>Snimač za video nadzor</em><br>koji razlikuje ljude i vozila.'],
 [2.6,5.4,'Dvorište sa <em>drvećem</em>?<br>Čovek da, grana ne.',''],
 [5.4,8.4,'Manji <em>objekat</em>?<br>Mali i tih snimač.',''],
];
const CH=[[3.0,5.4,'<b>AcuSense:</b> ljudi i vozila'],[5.8,8.4,'<b>4 kanala</b> · HDMI i VGA']];
const ST=[[8.4,9.2,'Do <em>6 MP</em>.'],[9.2,10.0,'<em>H.265</em><br>Pro+.'],[10.0,10.9,'<em>1</em> ležište<br>za disk.']];
const TL=$('tiles');[[380,90],[640,90],[380,250],[640,250]].forEach((p,i)=>TL.insertAdjacentHTML('beforeend',`<g class="tl" opacity="0"><rect x="${p[0]}" y="${p[1]}" width="250" height="150" fill="#245740"/><rect x="${p[0]}" y="${p[1]+100}" width="250" height="50" fill="#1d4a35"/><rect x="${p[0]+30+i*30}" y="${p[1]+40}" width="70" height="60" fill="#e9efe9"/><text x="${p[0]+12}" y="${p[1]+32}" fill="#cfe9da" font-family="Poppins" font-weight="800" font-size="22">CH${i+1}</text></g>`));
window.render=function(t){
 $('bar').style.width=(1080*t/14)+'px';
 $('b1').style.transform=`translate(${120+120*Math.sin(t*0.7)}px,${300+90*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.6)}px,${1200+120*Math.sin(t*0.8)}px)`;
 // proizvod
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.94+0.06*p+0.012*Math.sin(t*3);y=70*(1-p);rot=-5+5*p;ry=(1-p)*35;}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.6+0.012*Math.sin(t*3);y=-520+8*Math.sin(t*2.2);}
 else po=0;
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 $('prod').style.opacity=po;$('prod').style.transform=`translateY(${y}px) perspective(1400px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?1:0)*(0.6+0.4*Math.sin(t*4));
 // oznake u hook-u
 [['d1',1.2],['d2',1.55]].forEach(([id,s])=>{const q=back(cl((t-s)/0.3));const e=$(id);e.style.opacity=t<2.6?cl((t-s)/0.1):0;e.style.transform=`scale(${0.6+0.4*q}) translateY(${4*Math.sin(t*3+s)}px)`;});
 // kartica
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 $('tag').style.opacity=co;
 const inB=t>=5.4;const wipe=cl((t-5.4)/0.35);
 $('sA').style.opacity=inB?1-wipe:1;$('sB').style.opacity=inB?wipe:0;$('sB').style.clipPath=`inset(0 ${100-wipe*100}% 0 0)`;
 // A: grana se njiše, okvir „Pokret: grana“ precrtano zvono; čovek ulazi, zeleni okvir, obaveštenje
 $('branch').setAttribute('transform',`translate(787 300) rotate(${7*Math.sin(t*3.2)})`);
 $('bxT').setAttribute('opacity',cl((t-2.95)/0.2));
 const mx=430+170*ease(cl((t-3.3)/1.4));$('man').setAttribute('transform',`translate(${mx} ${520+3*Math.sin(t*12)})`);
 const bm=cl((t-3.9)/0.2);$('bxM').setAttribute('opacity',bm);
 $('bxMr').setAttribute('x',mx-60);$('bxMr').setAttribute('y',335);$('bxMl').setAttribute('x',mx-60);$('bxMl').setAttribute('y',291);$('bxMt').setAttribute('x',mx-48);$('bxMt').setAttribute('y',324);
 const nq=back(cl((t-4.3)/0.35));$('notif').setAttribute('opacity',cl((t-4.3)/0.1));$('notif').setAttribute('transform',`translate(0 ${(1-nq)*60})`);
 // B: kanali se pale jedan po jedan, HDMI
 [...document.querySelectorAll('.tl')].forEach((g,i)=>g.setAttribute('opacity',cl((t-5.9-i*0.25)/0.15)));
 $('hdl').setAttribute('opacity',cl((t-6.9)/0.2));
 $('hdmi').setAttribute('stroke-dasharray','600');$('hdmi').setAttribute('stroke-dashoffset',600*(1-ease(cl((t-5.6)/0.5))));
 $('mini').setAttribute('transform',`translate(0 ${-3*Math.abs(Math.sin(t*2))})`);
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'112px':'84px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(200px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // krajnja kartica
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const ei=document.querySelector('#end .im');const eq=back(cl((t-11.0)/0.5));ei.style.transform=`translateY(${(1-cl(eq))*40}px) scale(${0.85+0.15*eq+0.01*Math.sin(t*3)})`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=document.querySelector('#end .nm');let fs=80;e.style.fontSize=fs+'px';while(e.scrollWidth>1000&&fs>40){fs-=2;e.style.fontSize=fs+'px';}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
