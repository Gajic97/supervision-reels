<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#bar{position:absolute;top:0;left:0;height:8px;background:#6cc08f;z-index:10}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.02;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:160px;top:660px;width:760px;height:760px;transform-origin:50% 50%}
#prod .glow{position:absolute;left:80px;top:180px;width:600px;height:400px;border-radius:50%;background:radial-gradient(closest-side,rgba(108,192,143,.55),rgba(108,192,143,0));}
#prod img{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 50px 60px rgba(0,0,0,.6)) brightness(1.25)}
.ch{position:absolute;top:530px;width:150px;height:84px;margin-left:-75px;border-radius:24px;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.ch svg{width:42px;height:30px}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
#tag{position:absolute;left:26px;top:22px;background:rgba(11,26,20,.8);color:#cfe9da;font-weight:700;font-size:28px;padding:6px 18px;border-radius:20px;opacity:0}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .pr b{color:#6cc08f}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1" style="width:520px;height:520px;background:#2f7a50"></div>
<div class="blob" id="b2" style="width:420px;height:420px;background:#439665"></div>
<div id="endbg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="cam"><rect x="-26" y="-12" width="44" height="24" rx="10" fill="#fff"/><circle cx="-26" cy="0" r="9" fill="#0b1a14"/><rect x="14" y="-4" width="16" height="8" fill="#cfe9da"/></g>
<linearGradient id="nite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a2b"/><stop offset="1" stop-color="#245740"/></linearGradient>
</defs></svg>
<div id="card">
 <!-- scena A: kuća + telefon -->
 <svg id="sA" viewBox="0 0 980 700">
  <rect width="980" height="700" fill="url(#nite)"/>
  <rect y="520" width="980" height="180" fill="#1d4a35"/>
  <g transform="translate(40 0)">
   <rect x="40" y="290" width="460" height="240" fill="#e9efe9"/>
   <path d="M10 300 L270 140 L530 300Z" fill="#2f7a50"/>
   <rect x="90" y="350" width="80" height="70" fill="#ffd77a"/><rect x="360" y="350" width="80" height="70" fill="#ffd77a"/>
   <rect x="225" y="400" width="80" height="130" fill="#8a6a4a"/>
   <g id="camsA">
    <g transform="translate(70 305)"><circle class="pulse" r="30" fill="none" stroke="#6cc08f" stroke-width="5"/><use href="#cam" transform="scale(-1 1)"/></g>
    <g transform="translate(470 305)"><circle class="pulse" r="30" fill="none" stroke="#6cc08f" stroke-width="5"/><use href="#cam"/></g>
    <g transform="translate(70 470)"><circle class="pulse" r="30" fill="none" stroke="#6cc08f" stroke-width="5"/><use href="#cam" transform="scale(-1 1)"/></g>
    <g transform="translate(470 470)"><circle class="pulse" r="30" fill="none" stroke="#6cc08f" stroke-width="5"/><use href="#cam"/></g>
   </g>
  </g>
  <g id="phone" transform="translate(640 90)">
   <rect width="280" height="540" rx="40" fill="#0b1a14" stroke="#cfe9da" stroke-width="6"/>
   <rect x="20" y="60" width="240" height="420" rx="14" fill="#123528"/>
   <text x="140" y="44" text-anchor="middle" fill="#cfe9da" font-family="Poppins" font-weight="700" font-size="22">HiLookVision</text>
   <g id="tiles"></g>
  </g>
  <g id="link" stroke="#6cc08f" stroke-width="5" stroke-dasharray="12 10" fill="none"><path d="M560 300 Q610 250 640 300"/></g>
 </svg>
 <!-- scena B: lokal, ljudi i vozila -->
 <svg id="sB" viewBox="0 0 980 700" style="opacity:0">
  <rect width="980" height="700" fill="url(#nite)"/>
  <rect y="470" width="980" height="230" fill="#2b3f36"/>
  <g stroke="#cfe9da" stroke-width="6" stroke-dasharray="40 30" opacity=".5"><line x1="0" y1="610" x2="980" y2="610"/></g>
  <rect x="120" y="120" width="740" height="350" fill="#e9efe9"/>
  <path d="M100 120 L880 120 L860 190 L120 190Z" fill="#2f7a50"/>
  <g fill="#fff" opacity=".9"><path d="M120 190 L180 190 L170 215 L130 215Z"/></g>
  <text x="490" y="170" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="40" letter-spacing="6">LOKAL</text>
  <rect x="170" y="230" width="260" height="190" fill="#9fd3b6" opacity=".55"/><rect x="560" y="230" width="250" height="190" fill="#9fd3b6" opacity=".55"/>
  <rect x="450" y="250" width="90" height="220" fill="#5b7f6d"/>
  <g transform="translate(820 135)"><use href="#cam" transform="scale(-1 1)"/></g>
  <g id="pB"><circle cx="0" cy="-118" r="22" fill="#fff"/><path d="M-26 -90 Q0 -100 26 -90 L22 -20 L-22 -20Z" fill="#fff"/><rect x="-22" y="-22" width="16" height="22" fill="#fff"/><rect x="6" y="-22" width="16" height="22" fill="#fff"/></g>
  <g id="car"><rect width="220" height="72" rx="22" fill="#d9e4de"/><rect x="45" y="-42" width="130" height="52" rx="18" fill="#d9e4de"/><rect x="60" y="-32" width="45" height="32" rx="6" fill="#5b7f6d"/><rect x="115" y="-32" width="45" height="32" rx="6" fill="#5b7f6d"/><circle cx="50" cy="74" r="22" fill="#0b1a14"/><circle cx="170" cy="74" r="22" fill="#0b1a14"/></g>
  <g id="boxP" opacity="0"><rect id="bpR" width="110" height="170" fill="none" stroke="#6cc08f" stroke-width="6"/><rect id="bpL" width="130" height="40" rx="8" fill="#6cc08f"/><text id="bpT" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="26">Čovek</text></g>
  <g id="boxC" opacity="0"><rect id="bcR" width="250" height="160" fill="none" stroke="#fff2b8" stroke-width="6"/><rect id="bcL" width="140" height="40" rx="8" fill="#fff2b8"/><text id="bcT" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="26">Vozilo</text></g>
 </svg>
 <div id="tag">Primer</div>
</div>
<div id="prod"><div class="glow"></div><img src="assets/prod.png"></div>
<div id="chs"></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="bar"></div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">DVR SNIMAČ · 4 KANALA</div><div class="nm">HiLook DVR-204Q-M1</div><div class="sub">Analogne i IP kamere</div>
<div class="pr"><span><span id="pv">9.320</span> <b>RSD</b></span></div><div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const PRICE=9320;
const H=[
 [0,2.6,'Kuća. Lokal.<br><em>Kancelarija.</em>','Jedan <em>DVR snimač</em> za 4 kamere.'],
 [2.6,5.4,'<em>Kuća:</em> 4 kamere<br>na telefonu.',''],
 [5.4,8.4,'<em>Lokal:</em> ljudi<br>i vozila.',''],
];
const CH=[[3.0,5.4,'<b>HiLookVision</b> · cloud P2P'],[5.8,8.4,'<b>Manje</b> nepotrebnih alarma']];
const ST=[[8.4,9.2,'Do <em>6 IP</em><br>kamera.'],[9.2,10.0,'<em>H.265</em><br>Pro+.'],[10.0,10.9,'Disk do<br><em>10 TB</em>.']];
// kanali 1–4 oko snimača u hook-u
const chs=$('chs');const CHX=[255,415,575,735];
CHX.forEach((x,i)=>{const d=document.createElement('div');d.className='ch';d.style.left=(x+90)+'px';d.style.top='1150px';
 d.innerHTML=`<svg viewBox="-34 -16 68 32"><use href="#cam" fill="#0b1a14"/></svg>${i+1}`;chs.appendChild(d);});
// pločice na telefonu
const tiles=$('tiles');const TP=[[30,75],[145,75],[30,195],[145,195]];
TP.forEach(([x,y],i)=>{tiles.insertAdjacentHTML('beforeend',`<g class="tl" transform="translate(${x} ${y})" opacity="0"><rect width="105" height="105" rx="10" fill="#245740"/><path d="M20 80 L52 50 L85 80Z" fill="#2f7a50"/><rect x="30" y="72" width="45" height="22" fill="#e9efe9"/><text x="10" y="28" fill="#fff" font-family="Poppins" font-weight="800" font-size="22">${i+1}</text></g>`)});
tiles.insertAdjacentHTML('beforeend','<g transform="translate(30 330)"><rect width="220" height="60" rx="30" fill="#6cc08f"/><text x="110" y="40" text-anchor="middle" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="26">4 kamere</text></g>');
window.render=function(t){
 $('bar').style.width=(1080*t/14)+'px';
 $('b1').style.transform=`translate(${120+120*Math.sin(t*0.7)}px,${300+90*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.6)}px,${1200+120*Math.sin(t*0.8)}px)`;
 // proizvod
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=1.12-0.14*p+0.015*Math.sin(t*3);y=-60-40*(1-p);rot=-5+5*p;ry=(1-p)*40;}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.7;y=-560;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.7+0.5*p;y=-560+340*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 $('prod').style.opacity=po;$('prod').style.transform=`translateY(${y}px) perspective(1400px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('prod').querySelector('.glow').style.opacity=0.6+0.4*Math.sin(t*4);
 // kanali
 [...chs.children].forEach((e,i)=>{const t0=0.8+i*0.22;const v=t<2.6?cl((t-t0)/0.15):0;e.style.opacity=v;e.style.transform=`translateY(${(1-back(cl((t-t0)/0.35)))*60}px) scale(${0.7+0.3*back(cl((t-t0)/0.35))})`;});
 // kartica
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 $('tag').style.opacity=co;
 const inB=t>=5.4;
 const wipe=cl((t-5.4)/0.35);
 $('sA').style.opacity=inB?1-wipe:1;$('sB').style.opacity=inB?wipe:0;
 $('sB').style.clipPath=`circle(${wipe*90}% at 50% 50%)`;
 // A: kamere se pale jedna po jedna, pločice na telefonu
 [...document.querySelectorAll('#camsA > g')].forEach((g,i)=>{const t0=2.95+i*0.3;const on=cl((t-t0)/0.15);g.style.opacity=0.25+0.75*on;
   const r=g.querySelector('.pulse');const ph=((t-t0)*1.3)%1;r.setAttribute('r',on?24+30*ph:0);r.setAttribute('opacity',on?1-ph:0);});
 [...document.querySelectorAll('.tl')].forEach((g,i)=>{const t0=3.1+i*0.3;g.setAttribute('opacity',cl((t-t0)/0.15));});
 $('link').setAttribute('stroke-dashoffset',-t*60);
 // B: osoba ide ka vratima, auto prolazi
 const px=180+300*cl((t-5.5)/2.8),py=560;
 $('pB').setAttribute('transform',`translate(${px} ${py})`);
 const cx=1000-900*cl((t-5.6)/2.6),cy=600;
 $('car').setAttribute('transform',`translate(${cx} ${cy})`);
 const bP=cl((t-6.0)/0.2),bC=cl((t-6.5)/0.2);
 $('boxP').setAttribute('opacity',bP);$('bpR').setAttribute('x',px-55);$('bpR').setAttribute('y',py-160);
 $('bpL').setAttribute('x',px-55);$('bpL').setAttribute('y',py-205);$('bpT').setAttribute('x',px-45);$('bpT').setAttribute('y',py-176);
 $('boxC').setAttribute('opacity',bC);$('bcR').setAttribute('x',cx-15);$('bcR').setAttribute('y',cy-60);
 $('bcL').setAttribute('x',cx-15);$('bcL').setAttribute('y',cy-105);$('bcT').setAttribute('x',cx-3);$('bcT').setAttribute('y',cy-76);
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'120px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(160px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // krajnja kartica
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 $('pv').textContent=Math.round(PRICE*ease(cl((t-11.2)/0.9))).toLocaleString('de-DE');
 $('prod').querySelector('img').style.filter=pr>0.5?'drop-shadow(0 40px 50px rgba(0,0,0,.35))':'drop-shadow(0 50px 60px rgba(0,0,0,.6)) brightness(1.25)';
 $('prod').querySelector('.glow').style.display=pr>0.5?'none':'block';
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=document.querySelector('#end .nm');let fs=80;e.style.fontSize=fs+'px';while(e.scrollWidth>1000&&fs>40){fs-=2;e.style.fontSize=fs+'px';}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
