<!doctype html>
<html><head><meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#6cc08f;opacity:.35}
#bar{position:absolute;top:0;left:0;height:10px;background:#6cc08f;z-index:12}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:92px;line-height:1.06;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:190px;top:720px;width:700px;height:700px;transform-origin:50% 50%;z-index:6}
#prod img{width:100%;height:100%;border-radius:48px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
#glow{position:absolute;left:140px;top:670px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,#6cc08f55 0%,transparent 65%);z-index:5}
#tag{position:absolute;left:620px;top:730px;z-index:7;opacity:0}
#tag span{display:inline-block;white-space:nowrap;background:#fff;color:#123528;font-weight:800;font-size:46px;padding:12px 30px;border-radius:40px;border:5px dashed #2f7a50;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.pr-note{position:absolute;right:28px;bottom:22px;color:#cfe9da;font-weight:600;font-size:26px;opacity:.75}
#chip{position:absolute;top:1310px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:140px;line-height:1.04;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#chk{position:absolute;top:640px;left:0;right:0;text-align:center;font-weight:700;font-size:54px;letter-spacing:3px;color:#cfe9da;opacity:0;z-index:8}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:60px;padding:18px 50px;border-radius:70px}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#badge{position:absolute;left:720px;top:420px;width:190px;height:190px;border-radius:50%;background:#2f7a50;color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>

<div id="chip"><span></span></div>

<div class="pr"><span id="price" style="font-variant-numeric:tabular-nums">29.100 <b style="color:#6cc08f">RSD</b></span></div><div class="cta">super-vision.rs · <b>062/618-736</b></div></div>

<div style="position:absolute;left:-3000px"><img src="assets/nvr.png"><img src="assets/poe.png"></div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'IP komplet mora<br>da ima <em>3 stvari</em>','<em>IP komplet video nadzora</em> · 1 kamera'],
 [2.6,5.4,'Jedan kabl<br>do <em>kamere</em>',''],
 [5.4,8.4,'Gledaš sa<br><em>telefona</em>',''],
];
const CH=[[3.2,5.4,'Do <b>100 m</b> mrežnog kabla'],[5.9,8.4,'Još <b>3 slobodna</b> kanala']];
const ST=[[8.4,9.233,'3','assets/cam.png','Kamera<em>IP67 i mikrofon</em>'],[9.233,10.067,'2','assets/nvr.png','Snimač<em>4 kanala · H.265+</em>'],[10.067,10.9,'1','assets/poe.png','PoE svič<em>4 PoE porta</em>']];
(function(){let d='';for(let i=0;i<18;i++)d+=`<div class="dot" id="d${i}"></div>`;$('dots').innerHTML=d;})();
function fitNm(){const n=$('nm');let f=80;n.style.fontSize=f+'px';while(n.scrollWidth>1000&&f>40){f-=2;n.style.fontSize=f+'px';}}
fitNm();
const cab=document.getElementById('cab');let CL=900;
window.render=function(t){
 $('bar').style.width=(1080*cl(t/14))+'px';
 $('b1').style.transform=`translate(${-120+80*Math.sin(t*0.6)}px,${200+60*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${680+70*Math.cos(t*0.7)}px,${1250+80*Math.sin(t*0.4)}px)`;
 for(let i=0;i<18;i++){const e=$('d'+i);const sx=(i*137)%1000+40,sy=(i*311)%1800;let yy=(sy-t*40*(1+i%3))%1900;if(yy<0)yy+=1900;e.style.transform=`translate(${sx+20*Math.sin(t+i)}px,${yy}px)`;e.style.opacity=t>=10.9?0:.3;}
 // kit 700 px (MAX_PX 1467)
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.82+0.18*p+0.012*Math.sin(t*3);y=70-70*p+8*Math.sin(t*2.2);rot=-6+6*p;ry=34-34*p;}
 else if(t<10.9){po=0;}
 else {const p=ease(cl((t-10.9)/0.5));sc=(0.8+0.2*p)*0.72;y=-100+6*Math.sin(t*2)*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc=Math.min(1.12,sc*(1+0.06*(1-d/0.25)))});
 $('prod').style.opacity=po;$('prod').style.transform=`translate(0px,${y}px) perspective(1200px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?0.7+0.3*Math.sin(t*5):0);
 $('glow').style.transform=`translateY(${y}px) scale(${0.9+0.08*Math.sin(t*4)})`;
 const tg=$('tag');const tv=t<2.6?back(cl((t-1.2)/0.35)):0;tg.style.opacity=cl(tv*3);tg.style.transform=`scale(${0.5+0.5*tv}) rotate(${-6+3*Math.sin(t*6)}deg)`;
 // kartica sa ilustracijom 2.6-8.4
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 const sw=t>=5.4?ease(cl((t-5.4)/0.25)):0;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co-(t>=5.4&&t<5.65?0.03*(1-sw):0)})`;
 $('sA').setAttribute('opacity',t<5.4?1:0);$('sB').setAttribute('opacity',t>=5.4?sw:0);
 const la=t-2.6;const dp=ease(cl((la-0.2)/0.8));cab.setAttribute('stroke-dashoffset',CL*(1-dp));
 [['pk1',0],['pk2',0.45]].forEach(([id,o])=>{const g=$(id);const q=((la-1.0-o)/1.3)%1;if(la<1.0+o){g.setAttribute('opacity',0);return;}const L=cab.getTotalLength();const pt=cab.getPointAtLength(L*ease(q));g.setAttribute('opacity',cl(q*6)*cl((1-q)*6));g.setAttribute('transform',`translate(${pt.x} ${pt.y-34})`);});
 $('portA').setAttribute('opacity',0.5+0.5*Math.sin(t*10));
 $('camA').setAttribute('transform',`translate(20 140) rotate(${4*Math.sin(t*1.6)})`);
 const lb=t-5.4;
 $('w1').setAttribute('stroke-dashoffset',-t*60);
 [1,2,3].forEach(k=>{const v=(Math.sin(t*6-k*0.9)+1)/2;$('a'+k).setAttribute('opacity',lb>0.4?0.25+0.75*v:0)});
 $('led').setAttribute('opacity',0.4+0.6*((Math.sin(t*12)+1)/2));
 $('view').setAttribute('opacity',cl((lb-0.7)/0.3));
 $('ph').setAttribute('transform',`translate(600 ${70+(1-ease(cl(lb/0.4)))*80})`);
 [2,3,4].forEach((k,i)=>{const q=back(cl((lb-0.6-i*0.25)/0.3));const cx=(k-1)*80+52,cy=112;$('c'+k).setAttribute('transform',`translate(${cx} ${cy}) scale(${0.6+0.4*cl(q,0,1.15)+0.05*Math.sin(t*6+k)}) translate(${-cx} ${-cy})`);});
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.35)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.15+0.4):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'88px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati sa delovima: 3, 2, 1
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('st3');
 if(sm){se.querySelector('.num').textContent=sm[2];if(!$('stimg').src.endsWith(sm[3]))$('stimg').src=sm[3];se.querySelector('.lb').innerHTML=sm[4];
  const p=cl((t-sm[0])/0.14);se.style.opacity=1;
  se.querySelector('.num').style.transform=`scale(${1.6-0.6*ease(p)})`;
  se.querySelector('.pc').style.transform=`scale(${0.8+0.2*back(cl((t-sm[0])/0.3))}) rotate(${(1-ease(cl((t-sm[0])/0.3)))*-6+1.2*Math.sin(t*4)}deg)`;
  se.querySelector('.lb').style.transform=`translateY(${(1-ease(cl((t-sm[0]-0.05)/0.25)))*40}px)`;}
 else se.style.opacity=0;
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const op=ease(cl((t-11.2)/1.0));$('price').innerHTML=(Math.round(29100*op/10)*10).toLocaleString('de-DE')+' <b style="color:#6cc08f">RSD</b>';
 const bq=back(cl((t-11.6)/0.4));$('badge').style.opacity=t>=10.9?cl(bq):0;$('badge').style.transform=`scale(${cl(bq,0,1.2)*(1+0.03*Math.sin(t*6))}) rotate(${-10+4*Math.sin(t*2)}deg)`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fitNm();render(0);});
</script></body></html>
