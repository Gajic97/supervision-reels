<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1b4636 0%,#123528 50%,#071510 100%)}
.blob{position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(90px);opacity:.35}
#b1{background:#2f7a50}#b2{background:#439665;opacity:.22}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
#bar{position:absolute;left:0;top:0;height:10px;background:#6cc08f;z-index:30}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:80px;right:80px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.04;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:190px;top:700px;width:700px;height:700px;transform-origin:50% 50%}
#prod .wc{position:absolute;inset:0;background:#fff;border-radius:60px;box-shadow:0 50px 90px rgba(0,0,0,.5);overflow:hidden}
#prod .wc img{position:absolute;left:30px;top:30px;width:640px;height:640px}
#prod .shine{position:absolute;top:-40%;width:160px;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(20deg)}
.port{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.4)}
#card{position:absolute;left:50px;top:600px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
#card .tag{position:absolute;left:28px;bottom:20px;background:rgba(11,26,20,.8);color:#cfe9da;font-weight:600;font-size:28px;padding:6px 18px;border-radius:20px}
#chip{position:absolute;top:1350px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#price{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;z-index:7}
#price .card{margin-top:1150px;background:#fff;border-radius:44px;padding:40px 70px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45);position:relative}
#price .nm{font-weight:600;font-size:34px;color:#2f7a50}
#price .pr{font-weight:800;font-size:132px;color:#123528;line-height:1.1}
#price .pr small{font-size:60px}
#price .btn{margin-top:14px;background:#2f7a50;color:#fff;font-weight:700;font-size:44px;border-radius:30px;padding:18px 40px}
#price .cta{margin-top:50px;color:#fff;font-weight:700;font-size:54px}
#price .cta b{color:#6cc08f}
#finger{position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.85);border:6px solid #6cc08f;opacity:0;z-index:9}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div id="grid"></div><div id="bar"></div>
<div id="card">
 <!-- Scena A: tlocrt kuće i dvorišta, 8 analognih + 2 IP pozicije -->
 <svg id="svA" viewBox="0 0 980 700">
  <rect width="980" height="700" fill="#1d4a35"/>
  <g stroke="#2a6447" stroke-width="2" opacity=".6"><path d="M0 120H980M0 240H980M0 360H980M0 480H980M0 600H980M140 0V700M280 0V700M420 0V700M560 0V700M700 0V700M840 0V700"/></g>
  <rect x="60" y="80" width="860" height="560" rx="18" fill="none" stroke="#cfe9da" stroke-width="6" stroke-dasharray="16 12" opacity=".7"/>
  <rect x="300" y="210" width="380" height="290" rx="10" fill="#e9efe9"/>
  <path d="M300 355H680M490 210V500" stroke="#b9c9bf" stroke-width="6"/>
  <rect x="120" y="520" width="150" height="90" rx="10" fill="#3c6b55"/><text x="195" y="575" fill="#cfe9da" font-size="26" font-weight="600" text-anchor="middle" font-family="Poppins">garaža</text>
  <rect x="440" y="628" width="120" height="24" fill="#cfe9da"/><text x="500" y="676" fill="#cfe9da" font-size="24" font-weight="600" text-anchor="middle" font-family="Poppins">kapija</text>
  <g id="cams"></g>
 </svg>
 <!-- Scena B: različite kamere na jedan snimač -->
 <svg id="svB" viewBox="0 0 980 700" style="opacity:0">
  <rect width="980" height="700" fill="#173a2b"/>
  <g id="wires" fill="none" stroke="#6cc08f" stroke-width="7" stroke-linecap="round"></g>
  <g id="types"></g>
  <rect x="330" y="470" width="320" height="170" rx="26" fill="#fff"/>
  <image href="assets/dvr.jpg" x="350" y="400" width="280" height="280" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp)"/>
  <clipPath id="cp"><rect x="330" y="470" width="320" height="170" rx="26"/></clipPath>
 </svg>
 <div class="tag">Primer rasporeda</div>
</div>
<div id="prod"><div class="wc"><img src="assets/dvr.jpg"><div class="shine"></div></div></div>
<div id="ports"></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="price"><div class="card"><div class="nm">HiLook DVR-108G-M1/T · 8 kanala · 2 MP Lite</div><div class="pr"><span id="pv">7.860</span> <small>RSD</small></div><div class="btn" id="btn">Dodaj u korpu</div></div>
<div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="finger"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NS='http://www.w3.org/2000/svg';
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Peta kamera.<br>Snimač ima <em>4</em>.','<em>Snimač za kamere</em> sa 8 kanala.'],
 [2.6,5.4,'Ceo objekat na<br><em>jednom</em> snimaču.',''],
 [5.4,8.4,'Prima <em>gotovo svaku</em><br>kameru.',''],
];
const CH=[[3.0,5.4,'<b>8</b> analognih + <b>2</b> IP = <b>10</b>'],[5.8,8.4,'HDTVI · AHD · CVI · CVBS · <b>IP</b>']];
const ST=[[8.4,9.2,'H.265<br><em>Pro+</em>'],[9.2,10.0,'Disk do<br><em>4 TB</em>'],[10.0,10.9,'HDMI<br>i <em>VGA</em>']];
// kamere na tlocrtu: [x,y,ugao,tip]
const CAMS=[[300,210,225,'a'],[680,210,315,'a'],[680,500,45,'a'],[300,500,135,'a'],[490,210,270,'a'],[680,355,0,'a'],[195,520,250,'a'],[500,628,270,'a'],[90,110,45,'ip'],[890,110,135,'ip']];
const camsG=$('cams');
CAMS.forEach(([x,y,a,tp],i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${x} ${y})`);
 const w=document.createElementNS(NS,'path');const r=150,s=0.42,ar=a*Math.PI/180;
 w.setAttribute('d',`M0 0 L${r*Math.cos(ar-s)} ${r*Math.sin(ar-s)} A${r} ${r} 0 0 1 ${r*Math.cos(ar+s)} ${r*Math.sin(ar+s)}Z`);
 w.setAttribute('fill',tp==='ip'?'#ffd77a':'#b8f0cf');w.setAttribute('fill-opacity','.35');w.classList.add('w');g.appendChild(w);
 const d=document.createElementNS(tp==='ip'?NS:NS,tp==='ip'?'rect':'circle');
 if(tp==='ip'){d.setAttribute('x',-20);d.setAttribute('y',-20);d.setAttribute('width',40);d.setAttribute('height',40);d.setAttribute('rx',8);d.setAttribute('fill','#ffd77a');}
 else{d.setAttribute('r',20);d.setAttribute('fill','#6cc08f');}
 d.setAttribute('stroke','#0b1a14');d.setAttribute('stroke-width',5);g.appendChild(d);
 const tx=document.createElementNS(NS,'text');tx.textContent=tp==='ip'?'IP':(i+1);tx.setAttribute('y',tp==='ip'?9:10);tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size',tp==='ip'?20:26);tx.setAttribute('font-weight',800);tx.setAttribute('font-family','Poppins');tx.setAttribute('fill','#0b1a14');g.appendChild(tx);
 g.style.opacity=0;camsG.appendChild(g);});
// tipovi kamera u sceni B
const TY=[['HDTVI',110,110],['AHD',300,190],['CVI',490,90],['CVBS',680,190],['IP',870,110]];
TY.forEach(([n,x,y],i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${x} ${y})`);
 g.innerHTML=`<rect x="-78" y="-34" width="156" height="68" rx="34" fill="${n==='IP'?'#ffd77a':'#6cc08f'}"/><text y="12" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="32" fill="#0b1a14">${n}</text>`;
 g.style.opacity=0;$('types').appendChild(g);
 const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x} ${y+34} C${x} ${y+220} 490 ${300} 490 470`);p.setAttribute('pathLength',1);p.setAttribute('stroke-dasharray','1 1');p.setAttribute('stroke-dashoffset',1);$('wires').appendChild(p);});
// brojevi portova oko proizvoda u hook-u
const PORTS=[];for(let i=0;i<8;i++){const e=document.createElement('div');e.className='port';e.textContent=i+1;$('ports').appendChild(e);PORTS.push(e);}
window.render=function(t){
 $('bar').style.width=(1080*t/14)+'px';
 $('b1').style.transform=`translate(${-100+120*Math.sin(t*0.6)}px,${200+90*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.7)}px,${1100+120*Math.sin(t*0.45)}px)`;
 // proizvod
 let sc=1,y=0,rot=0,po=1;
 if(t<2.6){const p=ease(cl(t/0.8));sc=1.18-0.22*p+0.012*Math.sin(t*3);y=60-60*p+8*Math.sin(t*2.4);rot=-8+8*p+1.2*Math.sin(t*1.7);}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.5;y=-560+6*Math.sin(t*3);rot=Math.sin(t*2)*2;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.62-0.04*p;y=-330-20*p+6*Math.sin(t*2.5);}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 $('prod').style.opacity=po;$('prod').style.transform=`translateY(${y}px) scale(${sc}) rotate(${rot}deg)`;
 document.querySelector('#prod .shine').style.left=(-300+((t*420)%1500))+'px';
 // portovi 1-8 se pale oko snimača u hook-u
 PORTS.forEach((e,i)=>{const t0=0.35+i*0.13;const v=t<2.6?back(cl((t-t0)/0.3)):0;const a=(-90+i*45+t*12)*Math.PI/180;const R=470;
  e.style.left=(540+R*Math.cos(a))+'px';e.style.top=(1050+y+R*0.92*Math.sin(a))+'px';e.style.opacity=cl(v);e.style.transform=`scale(${cl(v,0,1.2)})`;
  e.style.background=i>=4?'#6cc08f':'#cfe9da';});
 // kartica sa ilustracijom
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.97+0.03*co})`;
 const inA=t<5.4;$('svA').style.opacity=inA?1:0;$('svB').style.opacity=inA?0:1;
 [...camsG.children].forEach((g,i)=>{const t0=2.85+i*0.2+(i>=8?0.15:0);const v=back(cl((t-t0)/0.3));g.style.opacity=cl((t-t0)/0.1);
  const [x,yy]=CAMS[i];g.setAttribute('transform',`translate(${x} ${yy}) scale(${cl(v,0,1.2)})`);
  g.querySelector('.w').setAttribute('fill-opacity',(0.25+0.15*Math.sin(t*5+i)).toFixed(2));});
 [...$('types').children].forEach((g,i)=>{const t0=5.6+i*0.22;const v=back(cl((t-t0)/0.3));g.style.opacity=cl((t-t0)/0.1);
  const [n,x,yy]=TY[i];g.setAttribute('transform',`translate(${x} ${yy+(1-cl(v))*-40}) scale(${cl(v,0,1.2)})`);});
 [...$('wires').children].forEach((p,i)=>{const t0=5.75+i*0.22;p.setAttribute('stroke-dashoffset',1-ease(cl((t-t0)/0.5)));});
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.3)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.08+0.6):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'118px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(160px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // cena
 const pr=ease(cl((t-10.9)/0.35));$('price').style.opacity=pr;$('price').style.transform=`translateY(${(1-pr)*80}px)`;
 $('pv').textContent=Math.round(7860*ease(cl((t-11.0)/0.9))).toLocaleString('de-DE');
 const tp=12.0;const fg=$('finger');const fo=t>=11.5&&t<12.5?cl((t-11.5)/0.15)*cl((12.5-t)/0.15):0;fg.style.opacity=fo;
 fg.style.left=(700-120*ease(cl((t-11.5)/0.5)))+'px';fg.style.top=(1590-150*ease(cl((t-11.5)/0.5)))+'px';
 fg.style.transform=`scale(${t>=tp&&t<tp+0.15?0.8:1})`;
 const done=t>=tp;$('btn').textContent=done?'✓ Dodato u korpu':'Dodaj u korpu';$('btn').style.background=done?'#123528':'#2f7a50';
 $('btn').style.transform=`scale(${done?1+0.04*Math.sin((t-tp)*Math.PI*2):1})`;
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>render(0));
</script></body></html>
