<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#6cc08f;opacity:.35}
#bar{position:absolute;top:0;left:0;height:10px;background:#6cc08f;z-index:12}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:92px;line-height:1.06;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:190px;top:720px;width:700px;height:700px;transform-origin:50% 50%;z-index:6}
#prod img{width:100%;height:100%;border-radius:48px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
#glow{position:absolute;left:140px;top:670px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,#6cc08f55 0%,transparent 65%);z-index:5}
#tag{position:absolute;left:620px;top:730px;z-index:7;opacity:0}
#tag span{display:inline-block;white-space:nowrap;background:#fff;color:#123528;font-weight:800;font-size:46px;padding:12px 30px;border-radius:40px;border:5px dashed #2f7a50;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.pr-note{position:absolute;right:28px;bottom:22px;color:#cfe9da;font-weight:600;font-size:26px;opacity:.75}
#chip{position:absolute;top:1310px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:140px;line-height:1.04;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#chk{position:absolute;top:640px;left:0;right:0;text-align:center;font-weight:700;font-size:54px;letter-spacing:3px;color:#cfe9da;opacity:0;z-index:8}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:60px;padding:18px 50px;border-radius:70px}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#badge{position:absolute;left:720px;top:420px;width:190px;height:190px;border-radius:50%;background:#2f7a50;color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<style>
#card{top:600px}
#chip{top:1340px}
#chip span{font-size:44px}
#prod{left:280px;top:740px;width:520px;height:520px}
#prod img{border-radius:36px}
#glow{left:190px;top:650px;width:700px;height:700px}
#tag{left:600px;top:700px}
#badge{left:720px;top:740px}
</style>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="dots"></div>
<div id="endbg"></div>
<div id="glow"></div>
<div id="card">
 <svg viewBox="0 0 980 700">
  <rect width="980" height="700" fill="#0c1d16"/>
  <!-- scena A: ulaz noću, belo svetlo do 40 m, slika u boji (ilustracija) -->
  <g id="sA">
   <rect x="0" y="0" width="980" height="700" fill="#0c1d16"/>
   <circle cx="120" cy="620" r="0"/>
   <rect x="0" y="540" width="980" height="160" fill="#14291f"/>
   <polygon id="beam" points="90,150 960,420 960,640 90,190" fill="#fff6d6" opacity=".22"/>
   <g id="colorObj">
    <rect x="560" y="430" width="230" height="90" rx="26" fill="#d64545"/><rect x="600" y="390" width="140" height="60" rx="18" fill="#e86a6a"/>
    <circle cx="610" cy="525" r="26" fill="#1a1a1a"/><circle cx="740" cy="525" r="26" fill="#1a1a1a"/>
    <g transform="translate(400 470)"><circle cx="0" cy="-96" r="26" fill="#f2d3b3"/><rect x="-32" y="-68" width="64" height="100" rx="24" fill="#3b7dd8"/><rect x="-28" y="32" width="24" height="70" rx="10" fill="#2b2f3a"/><rect x="4" y="32" width="24" height="70" rx="10" fill="#2b2f3a"/></g>
   </g>
   <g id="gray" opacity="1"><rect x="300" y="340" width="660" height="230" fill="#0c1d16" opacity=".0"/></g>
   <g id="camA" transform="translate(90 170)"><rect x="-46" y="-30" width="92" height="60" rx="28" fill="#fff"/><circle cx="18" cy="0" r="13" fill="#123528"/></g>
   <g id="m30" opacity="0"><line x1="90" y1="610" x2="900" y2="610" stroke="#6cc08f" stroke-width="5"/><line x1="90" y1="595" x2="90" y2="625" stroke="#6cc08f" stroke-width="5"/><line x1="900" y1="595" x2="900" y2="625" stroke="#6cc08f" stroke-width="5"/><rect x="420" y="630" width="160" height="50" rx="25" fill="#6cc08f"/><text x="500" y="666" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="30" text-anchor="middle">do 40 m</text></g>
   <g id="bw" opacity="0"><rect x="560" y="40" width="300" height="56" rx="28" fill="#6cc08f"/><text x="710" y="78" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28" text-anchor="middle">Boja i noću</text></g>
  </g>
  <!-- scena B: PoC -->
  <g id="sB" opacity="0">
   <rect x="0" y="0" width="980" height="700" fill="#1b4636"/>
   <!-- PoC: snimač -> jedan koaksijalni kabl -> kamera; bez adaptera (ilustracija) -->
   <g transform="translate(60 380)"><rect x="0" y="0" width="250" height="90" rx="18" fill="#2b2f3a"/><rect x="24" y="30" width="80" height="12" rx="6" fill="#6cc08f"/><text x="125" y="135" fill="#cfe9da" font-family="Poppins" font-weight="700" font-size="28" text-anchor="middle">PoC snimač</text></g>
   <path id="coax" d="M310 425 C520 425 560 200 760 200" stroke="#0b1a14" stroke-width="16" fill="none" stroke-linecap="round"/>
   <path id="pV" d="M310 425 C520 425 560 200 760 200" stroke="#6cc08f" stroke-width="8" fill="none" stroke-dasharray="26 70" stroke-linecap="round"/>
   <path id="pP" d="M310 425 C520 425 560 200 760 200" stroke="#f5c542" stroke-width="8" fill="none" stroke-dasharray="26 70" stroke-linecap="round"/>
   <g id="camP" transform="translate(800 190)"><rect x="-70" y="-34" width="140" height="68" rx="30" fill="#fff"/><circle cx="-40" cy="0" r="18" fill="#123528"/><rect x="40" y="30" width="20" height="60" fill="#cfd6cf"/></g>
   <g transform="translate(80 120)"><rect x="0" y="0" width="300" height="56" rx="28" fill="#6cc08f"/><text x="150" y="38" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28" text-anchor="middle">slika</text></g>
   <g transform="translate(80 190)"><rect x="0" y="0" width="300" height="56" rx="28" fill="#f5c542"/><text x="150" y="38" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="28" text-anchor="middle">struja</text></g>
   <g id="plug" transform="translate(760 470)"><rect x="-80" y="-60" width="160" height="120" rx="20" fill="#cfd6cf"/><circle cx="-30" cy="0" r="12" fill="#2b2f3a"/><circle cx="30" cy="0" r="12" fill="#2b2f3a"/>
    <g id="xP" opacity="0"><path d="M-95 -75 L95 75 M95 -75 L-95 75" stroke="#ff8a80" stroke-width="16" stroke-linecap="round"/></g></g>
   <text x="760" y="590" fill="#cfe9da" font-family="Poppins" font-weight="700" font-size="28" text-anchor="middle">poseban adapter</text>
  </g>
 </svg>
 <div class="pr-note">Primer</div>
</div>
<div id="prod"><img src="assets/prod.png"></div>
<div id="tag"><span>PoC</span></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>

<div id="stamp"><div></div></div>
<div id="end"><div class="cat">ANALOGNA KAMERA · COLORVU · 3K</div><div class="nm" id="nm">Hikvision DS-2CE12KF3T-LE</div><div class="sub">Slika i struja kroz isti kabl</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b><br><span style="font-weight:600;color:#2f7a50">super-vision.rs</span></div></div>
<div id="badge">PoC</div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Nema <em>utičnice</em><br>kod kamere?','<em>Kamera za ulaz</em>: struja kroz video kabl'],
 [2.6,5.4,'Jedan kabl:<br><em>slika i struja</em>',''],
 [5.4,8.4,'Noću u <em>boji</em>,<br>ne crno-belo',''],
];
const CH=[[3.0,5.4,'PoC: <b>bez adaptera</b>'],[5.8,8.4,'Belo svetlo <b>do 40 m</b>']];
const ST=[[8.4,9.2,'<em>3K</em><br>rezolucija'],[9.2,10.0,'<em>IP67</em><br>-40 do 60°'],[10.0,10.9,'Treba <em>PoC</em><br>snimač ili<br>injektor']];
(function(){let d='';for(let i=0;i<18;i++)d+=`<div class="dot" id="d${i}"></div>`;$('dots').innerHTML=d;})();
(function(){const n=$('nm');let f=80;n.style.fontSize=f+'px';while(n.scrollWidth>1000&&f>40){f-=2;n.style.fontSize=f+'px';}})();
window.render=function(t){
 $('bar').style.width=(1080*cl(t/14))+'px';
 $('b1').style.transform=`translate(${-120+80*Math.sin(t*0.6)}px,${200+60*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${680+70*Math.cos(t*0.7)}px,${1250+80*Math.sin(t*0.4)}px)`;
 for(let i=0;i<18;i++){const e=$('d'+i);const sx=(i*137)%1000+40,sy=(i*311)%1800;e.style.transform=`translate(${sx+20*Math.sin(t+i)}px,${(sy-t*40*(1+i%3))%1900+ (sy-t*40*(1+i%3)<0?1900:0)}px)`;e.style.opacity=t>=10.9?0:.3;}
 // proizvod 520 px, scale najviše 1.12 => 582 px <= MAX_PX 616
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.82+0.18*p+0.012*Math.sin(t*3);y=70-70*p+8*Math.sin(t*2.2);rot=-6+6*p;ry=34-34*p;}
 else if(t<10.9){po=0;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.8+0.2*p;y=10+6*Math.sin(t*2)*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc=Math.min(1.12,sc*(1+0.06*(1-d/0.25)))});
 $('prod').style.opacity=po;$('prod').style.transform=`translate(0px,${y}px) perspective(1200px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?0.7+0.3*Math.sin(t*5):0);
 $('glow').style.transform=`translateY(${y}px) scale(${0.9+0.08*Math.sin(t*4)})`;
 const tg=$('tag');const tv=t<2.6?back(cl((t-1.2)/0.35)):0;tg.style.opacity=cl(tv*3);tg.style.transform=`scale(${0.5+0.5*tv}) rotate(${-6+3*Math.sin(t*6)}deg)`;
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 const b=t<5.4;$('sA').setAttribute('opacity',b?0:1);$('sB').setAttribute('opacity',b?1:0);
 // A: snop se pali, objekti dobijaju boju, kota 40 m
 const la=t-5.4;const bm=ease(cl((la-0.3)/0.5));$('beam').setAttribute('opacity',(0.05+0.2*bm)*(1+0.08*Math.sin(t*9)));
 $('colorObj').style.filter=`grayscale(${1-ease(cl((la-0.7)/0.6))}) brightness(${0.45+0.55*bm})`;
 $('m30').setAttribute('opacity',cl((la-1.1)/0.3));
 const wq=back(cl((la-1.4)/0.35));$('bw').setAttribute('opacity',cl((la-1.4)/0.12));$('bw').setAttribute('transform',`translate(710 68) scale(${cl(wq,0,1.2)}) translate(-710 -68)`);
 $('camA').setAttribute('transform',`translate(90 170) rotate(${3*Math.sin(t*1.5)})`);
 // B: PoC impulsi kroz kabl
 const lb=t-2.6;$('pV').setAttribute('stroke-dashoffset',-t*240);$('pP').setAttribute('stroke-dashoffset',-t*240-48);
 const xq=back(cl((lb-1.0)/0.35));$('xP').setAttribute('opacity',cl((lb-1.0)/0.12));$('xP').setAttribute('transform',`scale(${cl(xq,0,1.2)})`);
 $('camP').setAttribute('transform',`translate(800 190) rotate(${3*Math.sin(t*1.5)})`);
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.35)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.15+0.4):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'96px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(0px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const bq=back(cl((t-11.6)/0.4));$('badge').style.opacity=t>=10.9?cl(bq):0;$('badge').style.transform=`scale(${cl(bq,0,1.2)*(1+0.03*Math.sin(t*6))}) rotate(${-10+4*Math.sin(t*2)}deg)`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{const n=$('nm');let f=80;n.style.fontSize=f+'px';while(n.scrollWidth>1000&&f>40){f-=2;n.style.fontSize=f+'px';}render(0);});
</script></body></html>
