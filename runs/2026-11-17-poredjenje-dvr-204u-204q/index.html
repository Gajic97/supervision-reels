<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#bar{position:absolute;top:0;left:0;height:8px;background:#6cc08f;z-index:10}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.02;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
/* slike: 400 px, scale najviše 1.06 => 424 px < MAX_PX 442 (A) / 467 (B) */
.pt{position:absolute;width:400px;height:400px;transform-origin:50% 50%;z-index:5}
.pt img{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:36px;box-shadow:0 36px 70px rgba(0,0,0,.5)}
.pt .lb{position:absolute;left:-40px;right:-40px;top:430px;text-align:center}
.pt .lb span{display:inline-block;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:46px;padding:10px 30px;border-radius:40px;white-space:nowrap}
#pB .lb span{background:#fff;color:#123528}
.glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(closest-side,rgba(108,192,143,.45),rgba(108,192,143,0));z-index:4}
#vs{position:absolute;left:490px;top:910px;width:100px;height:100px;border-radius:50%;background:#123528;border:4px solid #6cc08f;color:#fff;font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center;z-index:6}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card>svg{position:absolute;left:0;top:0;width:980px;height:700px}
#tag{position:absolute;left:26px;top:22px;background:rgba(11,26,20,.8);color:#cfe9da;font-weight:700;font-size:28px;padding:6px 18px;border-radius:20px}
#pip{position:absolute;right:28px;top:28px;width:400px;height:400px;border-radius:26px;overflow:hidden;border:6px solid #6cc08f;box-shadow:0 20px 40px rgba(0,0,0,.5);background:#0f2a1f;opacity:0}
#pip svg{position:absolute;left:0;top:0;width:980px;height:700px;transform-origin:0 0}
#pix{position:absolute;inset:0;pointer-events:none}
#pip .pt2{position:absolute;left:14px;bottom:14px;background:rgba(11,26,20,.88);color:#6cc08f;font-weight:800;font-size:32px;padding:6px 18px;border-radius:22px}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:140px;line-height:1.05;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#stamp div small{font-size:70px;color:#cfe9da;letter-spacing:0}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
/* krajnja slika 420 px, scale najviše ~1.01 => < MAX_PX 442 */
#end .im{position:absolute;left:330px;top:740px;width:420px;height:420px;border-radius:40px;box-shadow:0 30px 50px rgba(0,0,0,.16)}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .pr b{color:#6cc08f}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1" style="width:520px;height:520px;background:#2f7a50"></div>
<div class="blob" id="b2" style="width:420px;height:420px;background:#439665"></div>
<div id="endbg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a2b"/><stop offset="1" stop-color="#245740"/></linearGradient>
<linearGradient id="fovw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f0cf" stop-opacity=".6"/><stop offset="1" stop-color="#b8f0cf" stop-opacity=".1"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
<g id="yard">
 <rect width="980" height="700" fill="url(#sky)"/>
 <g fill="#fff" opacity=".5"><circle cx="560" cy="60" r="3"/><circle cx="470" cy="110" r="2"/><circle cx="380" cy="50" r="2"/></g>
 <rect y="430" width="980" height="270" fill="#1d4a35"/>
 <path d="M0 430 Q490 400 980 430 L980 445 L0 445Z" fill="#2a6447"/>
 <rect x="40" y="250" width="260" height="190" fill="#e9efe9"/><path d="M20 260 L170 150 L320 260Z" fill="#2f7a50"/>
 <rect x="90" y="300" width="60" height="60" fill="#ffd77a"/><rect x="200" y="330" width="60" height="110" fill="#8a6a4a"/>
 <rect x="890" y="300" width="22" height="140" fill="#6b4e33"/><circle cx="900" cy="280" r="70" fill="#2f7a50"/><circle cx="860" cy="310" r="45" fill="#3a8c5e"/>
 <g stroke="#cfe9da" stroke-width="6" opacity=".8"><line x1="330" y1="410" x2="980" y2="410"/>
 <line x1="350" y1="380" x2="350" y2="440"/><line x1="420" y1="380" x2="420" y2="440"/><line x1="490" y1="380" x2="490" y2="440"/><line x1="720" y1="380" x2="720" y2="440"/><line x1="790" y1="380" x2="790" y2="440"/><line x1="860" y1="380" x2="860" y2="440"/></g>
 <rect x="540" y="372" width="140" height="70" fill="none" stroke="#cfe9da" stroke-width="8"/>
 <path d="M610 700 L590 445 L640 445 L700 700Z" fill="#3c6b55"/>
 <g transform="translate(380 520)"><rect width="200" height="70" rx="22" fill="#d9e4de"/><rect x="40" y="-40" width="120" height="50" rx="18" fill="#d9e4de"/><rect x="55" y="-30" width="40" height="30" rx="6" fill="#5b7f6d"/><rect x="105" y="-30" width="40" height="30" rx="6" fill="#5b7f6d"/><circle cx="45" cy="72" r="22" fill="#0b1a14"/><circle cx="155" cy="72" r="22" fill="#0b1a14"/>
  <rect x="62" y="34" width="76" height="22" rx="4" fill="#fff" stroke="#0b1a14" stroke-width="2"/><g fill="#0b1a14"><rect x="68" y="40" width="8" height="10"/><rect x="80" y="40" width="8" height="10"/><rect x="96" y="40" width="8" height="10"/><rect x="108" y="40" width="8" height="10"/><rect x="122" y="40" width="8" height="10"/></g></g>
</g>
<g id="person"><circle cx="0" cy="-118" r="22" fill="#fff"/><path d="M-26 -90 Q0 -100 26 -90 L22 -20 L-22 -20Z" fill="#fff"/><rect x="-22" y="-22" width="16" height="22" fill="#fff"/><rect x="6" y="-22" width="16" height="22" fill="#fff"/></g>
</defs></svg>
<div id="card">
 <svg viewBox="0 0 980 700"><use href="#yard"/>
  <path id="fov" d="M175 205 L-200 700 L1180 700Z" fill="url(#fovw)" stroke="#b8f0cf" stroke-width="4" stroke-dasharray="14 10" opacity="0"/>
  <use id="p1" href="#person"/>
  <rect id="trk" width="150" height="110" fill="none" stroke="#6cc08f" stroke-width="6" stroke-dasharray="18 10" opacity="0"/>
  <g transform="translate(175 205)"><circle r="20" fill="#fff"/><circle r="9" fill="#0b1a14"/></g>
 </svg>
 <div id="tag">Primer</div>
 <div id="pip"><svg id="zs" viewBox="0 0 980 700"><use href="#yard"/><use id="p2" href="#person"/></svg><div id="pix"></div><div class="pt2">5 MP</div></div>
</div>
<div class="glow" id="gA"></div><div class="glow" id="gB"></div>
<div class="pt" id="pA"><img src="assets/prod.png"><div class="lb"><span>A · 5 MP</span></div></div>
<div class="pt" id="pB"><img src="assets/prodb.png"><div class="lb"><span>B · 2 MP</span></div></div>
<div id="vs">ili</div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="bar"></div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">DVR SNIMAČ · 4 KANALA · 5 MP</div><img class="im" src="assets/prod.png"><div class="nm">HiLook DVR-204U-M1/T</div><div class="sub">Kamere do 5 MP · disk do 10 TB</div>
<div class="pr"><span><span id="pv">15.380</span> <b>RSD</b></span></div><div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const PRICE=15380;
const H=[
 [0,2.6,'4 kanala.<br>Dve <em>oštrine</em>.','<em>DVR snimač 4 kanala</em>:<br>A ili B?'],
 [2.6,5.4,'<em>A:</em> kamere<br>do 5 MP.',''],
 [5.4,8.4,'<em>B:</em> kad je<br>dovoljno 2 MP.',''],
];
const CH=[[3.0,5.4,'<b>5 MP</b> · oštrija slika od 2 MP'],[5.8,8.4,'<b>2 MP</b> · 1080p Lite']];
const ST=[[8.4,9.2,'Oba: disk<br>do <em>10 TB</em>.'],[9.2,10.0,'<em>A</em> 15.380<br><em>B</em> 9.320<br><small>RSD</small>'],[10.0,10.9,'<em>A</em> ili <em>B</em>?<br>Napiši.']];
// osoba prilazi kapiji
const px=t=>860-250*cl((t-3.0)/3.2);const py=t=>470;
window.render=function(t){
 $('bar').style.width=(1080*t/14)+'px';
 $('b1').style.transform=`translate(${120+120*Math.sin(t*0.7)}px,${300+90*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${560+100*Math.cos(t*0.6)}px,${1200+120*Math.sin(t*0.8)}px)`;
 // dva snimača
 let sc=1,yA=0,yB=0,po=1,xA=70,xB=610,top=740;
 if(t<2.6){const pa=ease(cl(t/0.7)),pb=ease(cl((t-0.25)/0.7));xA=70-220*(1-pa);xB=610+220*(1-pb);sc=0.98+0.02*Math.sin(t*3);yA=8*Math.sin(t*2.4);yB=8*Math.sin(t*2.4+1.5);
   $('pA').style.opacity=pa;$('pB').style.opacity=pb;}
 else if(t>=8.4&&t<10.9){sc=0.66;top=300;xA=200;xB=480;$('pA').style.opacity=1;$('pB').style.opacity=1;}
 else po=0;
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc*=1+0.06*(1-d/0.25)});
 if(!po){$('pA').style.opacity=0;$('pB').style.opacity=0;}
 [['pA',xA,yA,-5],['pB',xB,yB,5]].forEach(([id,x,y,r])=>{const e=$(id);e.style.left=x+'px';e.style.top=top+'px';
   e.style.transform=`translateY(${y}px) perspective(1200px) rotateY(${t<2.6?r*3*(1-ease(cl(t/0.9))):0}deg) scale(${sc}) rotate(${t<2.6?r*(1-ease(cl(t/0.9))):0}deg)`;
   e.querySelector('.lb').style.opacity=t<2.6?cl((t-0.9)/0.2):(t>=8.4&&t<10.9?1:0);
   e.querySelector('.lb').style.transform=`scale(${t<2.6?0.7+0.3*back(cl((t-0.9)/0.35)):1})`;});
 $('vs').style.opacity=t<2.6?cl((t-0.7)/0.2):0;$('vs').style.transform=`scale(${0.5+0.5*back(cl((t-0.7)/0.35))})`;
 [['gA',xA-50,top-50],['gB',xB-50,top-50]].forEach(([id,x,y])=>{const g=$(id);g.style.left=x+'px';g.style.top=y+'px';g.style.opacity=(t<2.6?1:0)*(0.6+0.4*Math.sin(t*4));});
 // kartica sa primerom
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 $('fov').setAttribute('opacity',co*cl((t-2.9)/0.3)*(0.85+0.15*Math.sin(t*6)));
 const X=px(t),Y=py(t);$('p1').setAttribute('transform',`translate(${X} ${Y}) scale(0.8)`);$('p2').setAttribute('transform',`translate(${X} ${Y}) scale(0.8)`);
 // okvir na tablici auta (detalj)
 const tO=t>=3.4&&t<8.4?cl((t-3.4)/0.25):0;const tr=$('trk');tr.setAttribute('x',405);tr.setAttribute('y',535);tr.setAttribute('opacity',tO);
 // uvećan prikaz: A oštro, B grublji pikseli (ilustracija)
 const inB=t>=5.4;const pip=$('pip');
 const pin=inB?back(cl((t-5.6)/0.35)):back(cl((t-3.6)/0.35));
 pip.style.opacity=t>=3.6&&t<8.4?cl(pin):0;pip.style.transform=`scale(${0.6+0.4*cl(pin,0,1.1)})`;pip.style.transformOrigin='100% 0';
 pip.querySelector('.pt2').textContent=inB?'2 MP · uvećano':'5 MP · uvećano';
 const Z=2.6;const zs=$('zs');zs.style.transform=`translate(${200-480*Z}px,${200-560*Z}px) scale(${Z})`;
 zs.style.filter=inB?'blur(5px)':'none';
 const g=inB?34:8;$('pix').style.backgroundImage=`linear-gradient(rgba(11,26,20,${inB?.35:.12}) 2px,transparent 2px),linear-gradient(90deg,rgba(11,26,20,${inB?.35:.12}) 2px,transparent 2px)`;
 $('pix').style.backgroundSize=`${g}px ${g}px`;
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?1:back(cl(local/0.35));
  he.style.opacity=hh[0]===0?1:cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'112px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(240px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // krajnja kartica
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const ei=document.querySelector('#end .im');const eq=back(cl((t-11.0)/0.5));ei.style.transform=`translateY(${(1-cl(eq))*40}px) scale(${Math.min(1.01,0.85+0.15*eq)-0.01+0.01*Math.sin(t*3)})`;
 $('pv').textContent=Math.round(PRICE*ease(cl((t-11.2)/0.9))).toLocaleString('de-DE');
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=document.querySelector('#end .nm');let fs=80;e.style.fontSize=fs+'px';while(e.scrollWidth>1000&&fs>40){fs-=2;e.style.fontSize=fs+'px';}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
