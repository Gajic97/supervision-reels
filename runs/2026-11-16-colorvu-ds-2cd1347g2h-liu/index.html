<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
#bar{position:absolute;top:0;left:0;height:10px;background:#6cc08f;z-index:12}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.04;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:58px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:240px;top:760px;width:600px;height:600px;transform-origin:50% 50%;z-index:6}
#prod img{width:100%;height:100%;border-radius:48px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
#glow{position:absolute;left:190px;top:710px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#6cc08f55 0%,transparent 65%);z-index:5}
#tag{position:absolute;left:640px;top:740px;z-index:7;opacity:0}
#tag span{display:inline-block;white-space:nowrap;background:#fff;color:#123528;font-weight:800;font-size:48px;padding:12px 30px;border-radius:40px;border:5px dashed #d64545;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.pr-note{position:absolute;right:28px;bottom:22px;color:#cfe9da;font-weight:600;font-size:26px;opacity:.75}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#badge{position:absolute;left:780px;top:400px;width:190px;height:190px;border-radius:50%;background:#2f7a50;color:#fff;font-weight:800;font-size:64px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="endbg"></div>
<div id="glow"></div>
<!-- ilustracije primene (Primer) -->
<div id="card">
 <svg viewBox="0 0 980 700">
  <defs>
   <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08140f"/><stop offset="1" stop-color="#11281d"/></linearGradient>
   <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6d8" stop-opacity=".85"/><stop offset="1" stop-color="#fff6d8" stop-opacity=".08"/></linearGradient>
   <filter id="gray"><feColorMatrix id="cm" type="saturate" values="0"/></filter>
  </defs>
  <g id="sA">
   <g id="yardA">
    <rect width="980" height="700" fill="url(#nsky)"/>
    <g fill="#fff" opacity=".5"><circle cx="760" cy="70" r="3"/><circle cx="860" cy="120" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="910" cy="40" r="3"/></g>
    <circle cx="840" cy="90" r="30" fill="#e9f6ef" opacity=".6"/>
    <rect y="430" width="980" height="270" fill="#173d2b"/>
    <rect x="40" y="230" width="280" height="210" fill="#d9e2dc"/><path d="M20 240 L180 130 L340 240Z" fill="#2f7a50"/>
    <rect x="90" y="290" width="60" height="60" fill="#ffd77a"/><rect x="210" y="320" width="64" height="120" fill="#8a6a4a"/>
    <rect x="880" y="300" width="22" height="140" fill="#6b4e33"/><circle cx="890" cy="280" r="70" fill="#2f7a50"/>
    <g transform="translate(560 500)"><rect width="220" height="76" rx="24" fill="#c0392b"/><rect x="44" y="-44" width="130" height="54" rx="18" fill="#c0392b"/><rect x="60" y="-34" width="44" height="32" rx="6" fill="#9fc3d6"/><rect x="114" y="-34" width="44" height="32" rx="6" fill="#9fc3d6"/><circle cx="50" cy="78" r="24" fill="#0b1a14"/><circle cx="170" cy="78" r="24" fill="#0b1a14"/></g>
    <g transform="translate(470 560)"><circle cx="0" cy="-118" r="22" fill="#f1c7a3"/><path d="M-26 -90 Q0 -100 26 -90 L22 -20 L-22 -20Z" fill="#2e86de"/><rect x="-22" y="-22" width="16" height="30" fill="#34495e"/><rect x="6" y="-22" width="16" height="30" fill="#34495e"/></g>
   </g>
   <rect id="dim" width="980" height="700" fill="#000" opacity=".55"/>
   <path id="beamA" d="M325 250 L980 470 L980 700 L420 700Z" fill="url(#beam)" opacity="0"/>
   <g transform="translate(325 250)"><circle r="22" fill="#fff"/><circle r="10" fill="#0b1a14"/></g>
   <text id="m30" x="940" y="420" fill="#fff6d8" font-family="Poppins" font-weight="800" font-size="36" text-anchor="end" opacity="0">do 30 m</text>
  </g>
  <g id="sB" opacity="0">
   <rect width="980" height="700" fill="#1a2420"/>
   <!-- izlog (jako svetlo) -->
   <rect x="560" y="80" width="380" height="520" fill="#fffbe8"/>
   <rect x="560" y="80" width="380" height="520" fill="none" stroke="#3b4247" stroke-width="14"/>
   <line x1="750" y1="80" x2="750" y2="600" stroke="#3b4247" stroke-width="10"/>
   <!-- police u senci -->
   <g id="shelf"><rect x="60" y="140" width="420" height="16" fill="#3a4a43"/><rect x="60" y="300" width="420" height="16" fill="#3a4a43"/><rect x="60" y="460" width="420" height="16" fill="#3a4a43"/>
    <g><rect x="80" y="70" width="60" height="70" rx="6" fill="#e67e22"/><rect x="160" y="90" width="50" height="50" rx="6" fill="#2e86de"/><rect x="230" y="60" width="70" height="80" rx="6" fill="#27ae60"/><rect x="320" y="85" width="60" height="55" rx="6" fill="#c0392b"/><rect x="400" y="75" width="60" height="65" rx="6" fill="#f1c40f"/>
    <rect x="90" y="230" width="70" height="70" rx="6" fill="#8e44ad"/><rect x="180" y="245" width="60" height="55" rx="6" fill="#16a085"/><rect x="260" y="225" width="80" height="75" rx="6" fill="#e74c3c"/><rect x="360" y="240" width="90" height="60" rx="6" fill="#3498db"/>
    <rect x="80" y="390" width="90" height="70" rx="6" fill="#d35400"/><rect x="190" y="400" width="70" height="60" rx="6" fill="#2ecc71"/><rect x="280" y="380" width="70" height="80" rx="6" fill="#9b59b6"/><rect x="370" y="395" width="90" height="65" rx="6" fill="#f39c12"/></g></g>
   <rect id="shade" x="0" y="0" width="540" height="700" fill="#000" opacity=".75"/>
   <rect x="0" y="600" width="980" height="100" fill="#2a3530"/>
   <g id="sweep"><rect x="-6" y="0" width="12" height="700" fill="#6cc08f" opacity=".8"/></g>
   <text id="wl" x="270" y="662" fill="#6cc08f" font-family="Poppins" font-weight="800" font-size="34" text-anchor="middle" opacity="0">senka</text>
   <text id="wr" x="690" y="662" fill="#fff6d8" font-family="Poppins" font-weight="800" font-size="34" text-anchor="middle" opacity="0">jako svetlo</text>
  </g>
 </svg>
 <div class="pr-note">Primer</div>
</div>
<div id="prod"><img src="assets/prod.png"></div>
<div id="tag"><span>boja noću</span></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">IP TURRET KAMERA · COLORVU</div><div class="nm">DS-2CD1347G2H-LIU</div><div class="sub">4 MP · slika u boji i noću</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b></div></div>
<div id="badge">4 MP</div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Treba ti <em>kamera<br>u boji noću</em>?','Kuća, radnja ili garaža.'],
 [2.6,5.4,'Kuća: <em>dvorište</em><br>u boji i noću.',''],
 [5.4,8.4,'Radnja: <em>izlog</em><br>i senka zajedno.',''],
];
const CH=[[3.0,5.4,'<b>Belo svetlo</b> do 30 m'],[5.8,8.4,'<b>WDR 120 dB</b> · svetlo i senka']];
const ST=[[8.4,9.2,'Magacin.<br><em>Garaža.</em>'],[9.2,10.0,'<em>4 MP</em><br>slika.'],[10.0,10.9,'Napajanje<br>preko <em>PoE</em>.']];
const LEN={};
window.render=function(t){
 $('bar').style.width=(1080*cl(t/14))+'px';
 $('b1').style.transform=`translate(${-120+80*Math.sin(t*0.6)}px,${200+60*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${680+70*Math.cos(t*0.7)}px,${1250+80*Math.sin(t*0.4)}px)`;
 // proizvod (širina 440 px, scale najviše 1.12 => <= 493 px < MAX_PX 499)
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.8+0.3*p+0.012*Math.sin(t*3);y=60-60*p+8*Math.sin(t*2.2);rot=-8+8*p;ry=30-30*p;}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.42;y=-460+6*Math.sin(t*3);}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.42+0.58*p;y=-460+300*p+6*Math.sin(t*2)*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc=Math.min(1.12,sc*(1+0.06*(1-d/0.25)))});
 $('prod').style.opacity=po;$('prod').style.transform=`translate(0px,${y}px) perspective(1200px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?0.7+0.3*Math.sin(t*5):t>=10.9?0:0.5);
 $('glow').style.transform=`translateY(${y}px) scale(${0.9+0.08*Math.sin(t*4)})`;
 // oznaka "boja noću"
 const tg=$('tag');const tv=t<2.6?back(cl((t-1.2)/0.35)):0;tg.style.opacity=cl(tv*3);tg.style.transform=`scale(${0.5+0.5*tv}) rotate(${-6+3*Math.sin(t*6)}deg)`;
 // kartica sa ilustracijom
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 // scena A: kamera pali belo svetlo, dvorište dobija boju
 const a=t<5.4;$('sA').setAttribute('opacity',a?1:0);$('sB').setAttribute('opacity',a?0:1);
 const L=ease(cl((t-3.3)/0.5));$('beamA').setAttribute('opacity',L*(0.85+0.1*Math.sin(t*9)));$('dim').setAttribute('opacity',0.6-0.45*L);
 $('cm').setAttribute('values',0.05+0.95*L);$('yardA').setAttribute('filter','url(#gray)');$('m30').setAttribute('opacity',cl((t-3.9)/0.3));
 // scena B: WDR - senka se otvara, skener prelazi kadar
 const W=ease(cl((t-6.2)/0.7));$('shade').setAttribute('opacity',0.75-0.6*W);
 $('sweep').setAttribute('transform',`translate(${980*cl((t-5.8)/1.2)} 0)`);$('sweep').setAttribute('opacity',t>5.8&&t<7.0?1:0);
 $('wl').setAttribute('opacity',cl((t-7.0)/0.25));$('wr').setAttribute('opacity',cl((t-7.2)/0.25));
 // naslov
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.35)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.15+0.4):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'120px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 // čip
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 // pečati
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(160px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 // krajnja kartica
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const bq=back(cl((t-11.6)/0.4));$('badge').style.opacity=t>=10.9?cl(bq):0;$('badge').style.transform=`scale(${cl(bq,0,1.2)*(1+0.03*Math.sin(t*6))}) rotate(${-10+4*Math.sin(t*2)}deg)`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>render(0));
</script></body></html>
