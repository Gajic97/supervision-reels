<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#6cc08f;opacity:.35}
#bar{position:absolute;top:0;left:0;height:10px;background:#6cc08f;z-index:12}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:92px;line-height:1.06;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:56px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:350px;top:820px;width:380px;height:380px;transform-origin:50% 50%;z-index:6}
#prod img{width:100%;height:100%;border-radius:40px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
#beam{position:absolute;left:540px;top:1010px;width:0;height:0;z-index:5}
#beam svg{position:absolute;left:-540px;top:-80px;width:1080px;height:900px;overflow:visible}
#glow{position:absolute;left:240px;top:710px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#6cc08f55 0%,transparent 65%);z-index:4}
#tag{position:absolute;left:600px;top:780px;z-index:7;opacity:0}
#tag span{display:inline-block;white-space:nowrap;background:#fff;color:#123528;font-weight:800;font-size:44px;padding:12px 30px;border-radius:40px;border:5px dashed #2f7a50;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.pr-note{position:absolute;right:28px;bottom:22px;color:#cfe9da;font-weight:600;font-size:26px;opacity:.75}
.who{position:absolute;left:28px;top:24px;background:#6cc08f;color:#0b1a14;font-weight:800;font-size:34px;padding:8px 26px;border-radius:30px}
#chip{position:absolute;top:1310px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:140px;line-height:1.04;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:64px;padding:18px 50px;border-radius:70px;font-variant-numeric:tabular-nums}
#end .pr b{color:#6cc08f}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#badge{position:absolute;left:720px;top:440px;width:190px;height:190px;border-radius:50%;background:#2f7a50;color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="dots"></div>
<div id="endbg"></div>
<div id="glow"></div>
<div id="beam"><svg viewBox="0 0 1080 900"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0" stop-opacity=".55"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></linearGradient></defs><polygon id="beamP" points="540,80 160,900 920,900" fill="url(#bg1)"/></svg></div>
<div id="card">
 <svg viewBox="0 0 980 700">
  <defs><linearGradient id="lc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0" stop-opacity=".7"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></linearGradient></defs>
  <!-- scena A: ulaz kuće noću -->
  <g id="sA">
   <rect width="980" height="700" fill="#0d1b2a"/>
   <circle cx="860" cy="110" r="40" fill="#e8e8d0" opacity=".8"/>
   <rect x="0" y="560" width="980" height="140" fill="#1a2630"/>
   <g id="houseBW"><rect x="160" y="140" width="660" height="420" fill="#3a3f44"/><rect x="420" y="300" width="140" height="260" fill="#55595d"/><rect x="230" y="250" width="120" height="110" fill="#22272b"/><rect x="630" y="250" width="120" height="110" fill="#22272b"/><circle cx="270" cy="520" r="40" fill="#4a4f53"/><g transform="translate(640 560)"><circle cx="0" cy="-150" r="24" fill="#8a8f93"/><rect x="-26" y="-124" width="52" height="80" rx="18" fill="#6f7478"/><rect x="-20" y="-48" width="16" height="48" rx="8" fill="#5a5f63"/><rect x="4" y="-48" width="16" height="48" rx="8" fill="#5a5f63"/></g></g>
   <g id="houseC" opacity="0"><rect x="160" y="140" width="660" height="420" fill="#e9dcc4"/><rect x="420" y="300" width="140" height="260" fill="#2f7a50"/><circle cx="535" cy="430" r="8" fill="#f2c94c"/><rect x="230" y="250" width="120" height="110" fill="#2d4a63"/><rect x="630" y="250" width="120" height="110" fill="#2d4a63"/><circle cx="270" cy="520" r="40" fill="#3a8c5e"/><rect x="250" y="520" width="40" height="40" fill="#b4483d"/><g transform="translate(640 560)"><circle cx="0" cy="-150" r="24" fill="#e0b48f"/><rect x="-26" y="-124" width="52" height="80" rx="18" fill="#d64545"/><rect x="-20" y="-48" width="16" height="48" rx="8" fill="#2d4a63"/><rect x="4" y="-48" width="16" height="48" rx="8" fill="#2d4a63"/></g><polygon id="lcone" points="490,170 150,700 830,700" fill="url(#lc)"/></g>
   <g transform="translate(490 150)"><rect x="-44" y="-24" width="88" height="40" rx="18" fill="#fff"/><circle cx="0" cy="0" r="14" fill="#123528"/><circle id="led" cx="0" cy="0" r="6" fill="#fffbe0"/></g>
   <g id="modeIR"><rect x="40" y="610" width="300" height="60" rx="30" fill="#55595d"/><text x="190" y="651" fill="#fff" font-family="Poppins" font-weight="700" font-size="30" text-anchor="middle">IR · crno-belo</text></g>
   <g id="modeW" opacity="0"><rect x="460" y="610" width="370" height="60" rx="30" fill="#6cc08f"/><text x="645" y="651" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="30" text-anchor="middle">Belo svetlo · u boji</text></g>
  </g>
  <!-- scena B: lokal noću, detekcija ljudi -->
  <g id="sB" opacity="0">
   <rect width="980" height="700" fill="#14202b"/>
   <rect x="0" y="560" width="980" height="140" fill="#2a3640"/>
   <rect x="120" y="150" width="740" height="410" fill="#e9efe9"/>
   <rect x="120" y="150" width="740" height="80" fill="#2f7a50"/>
   <text x="490" y="205" fill="#fff" font-family="Poppins" font-weight="800" font-size="44" text-anchor="middle" letter-spacing="6">LOKAL</text>
   <rect x="170" y="270" width="380" height="290" fill="#2d4a63"/><rect x="590" y="270" width="220" height="290" fill="#6b4a32"/>
   <g fill="#f2c94c" opacity=".55"><rect x="200" y="300" width="80" height="60"/><rect x="300" y="300" width="80" height="60"/><rect x="400" y="300" width="80" height="60"/></g>
   <g id="pers"><circle cx="0" cy="-130" r="24" fill="#e0b48f"/><rect x="-26" y="-104" width="52" height="80" rx="18" fill="#2f7a50"/><rect id="legL" x="-20" y="-28" width="16" height="56" rx="8" fill="#123528"/><rect id="legR" x="4" y="-28" width="16" height="56" rx="8" fill="#123528"/>
    <g id="pbox"><rect x="-58" y="-172" width="116" height="214" rx="10" fill="none" stroke="#6cc08f" stroke-width="6"/><rect x="-58" y="-216" width="130" height="44" rx="8" fill="#6cc08f"/><text x="7" y="-184" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="26" text-anchor="middle">Osoba</text></g></g>
   <g transform="translate(860 120)"><rect x="-44" y="-24" width="88" height="40" rx="18" fill="#fff"/><circle cx="0" cy="0" r="14" fill="#123528"/></g>
   <polygon id="fovB" points="860,130 0,560 0,700 700,700" fill="#fffbe0" opacity=".12"/>
  </g>
 </svg>
 <div class="who" id="who">Ulaz kuće</div>
 <div class="pr-note">Primer</div>
</div>
<div id="prod"><img src="assets/prod.png"></div>
<div id="tag"><span>dual light</span></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">IP TURRET KAMERA · DUAL LIGHT</div><div class="nm" id="nm">HiLook IPC-T240HA-LU</div><div class="sub">Noću u boji · 4 MP</div>
<div class="pr"><span id="price">8.420 <b>RSD</b></span></div><div class="cta">super-vision.rs · <b>062/618-736</b></div></div>
<div id="badge">4 MP</div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Ulaz, lokal, garaža:<br>noću <em>u boji</em>.','<em>Kamera u boji noću</em> · 4 MP'],
 [2.6,5.4,'Za ulaz:<br>slika <em>u boji</em>.',''],
 [5.4,8.4,'Za lokal:<br><em>uoči osobu</em>.',''],
];
const CH=[[3.0,5.4,'<b>Belo svetlo</b> do 15 m'],[5.8,8.4,'Detekcija <b>ljudi</b>']];
const ST=[[8.4,9.2,'Za<br><em>garažu</em>.'],[9.2,10.0,'<em>IP67</em><br>kućište.'],[10.0,10.9,'IR<br><em>do 20 m</em>.']];
(function(){let d='';for(let i=0;i<18;i++)d+=`<div class="dot" id="d${i}"></div>`;$('dots').innerHTML=d;})();
function fit(){const n=$('nm');let f=80;n.style.fontSize=f+'px';while(n.scrollWidth>1000&&f>40){f-=2;n.style.fontSize=f+'px';}}
window.render=function(t){
 $('bar').style.width=(1080*cl(t/14))+'px';
 $('b1').style.transform=`translate(${-120+80*Math.sin(t*0.6)}px,${200+60*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${680+70*Math.cos(t*0.7)}px,${1250+80*Math.sin(t*0.4)}px)`;
 for(let i=0;i<18;i++){const e=$('d'+i);const sx=(i*137)%1000+40,sy=(i*311)%1800;let yy=(sy-t*40*(1+i%3))%1900;if(yy<0)yy+=1900;e.style.transform=`translate(${sx+20*Math.sin(t+i)}px,${yy}px)`;e.style.opacity=t>=10.9?0:.3;}
 // proizvod 380 px, scale najviše 1.1 => 418 px < MAX_PX 420
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.84+0.14*p+0.012*Math.sin(t*3);y=60-60*p+8*Math.sin(t*2.2);rot=-6+6*p;ry=34-34*p;}
 else if(t<10.9){po=0;}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.6+0.45*p;y=-80+6*Math.sin(t*2)*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc=Math.min(1.1,sc*(1+0.06*(1-d/0.25)))});
 sc=Math.min(sc,1.1);
 $('prod').style.opacity=po;$('prod').style.transform=`translate(0px,${y}px) perspective(1200px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?0.7+0.3*Math.sin(t*5):0);
 $('glow').style.transform=`translateY(${y}px) scale(${0.9+0.08*Math.sin(t*4)})`;
 // snop belog svetla ispod kamere u hook-u
 const bo=t<2.6?ease(cl((t-0.5)/0.4))*(0.85+0.15*Math.sin(t*9)):0;$('beam').style.opacity=bo;
 const tg=$('tag');const tv=t<2.6?back(cl((t-1.2)/0.35)):0;tg.style.opacity=cl(tv*3);tg.style.transform=`scale(${0.5+0.5*tv}) rotate(${-6+3*Math.sin(t*6)}deg)`;
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 const b=t>=5.4;$('sA').setAttribute('opacity',b?0:1);$('sB').setAttribute('opacity',b?1:0);$('who').textContent=b?'Lokal':'Ulaz kuće';
 // A: IR -> belo svetlo
 const lp=ease(cl((t-3.7)/0.35));$('houseC').setAttribute('opacity',lp);$('modeW').setAttribute('opacity',lp);$('modeIR').setAttribute('opacity',1-lp*0.6);
 $('lcone').setAttribute('opacity',0.7+0.3*Math.sin(t*7));$('led').setAttribute('fill',lp>0.5?'#ffffff':'#ff8a80');
 // B: osoba ulazi, okvir se pojavi
 const lb=t-5.4;const px=1040-cl(lb/2.2)*560;$('pers').setAttribute('transform',`translate(${px} 600)`);
 const sw=Math.sin(lb*12)*8;$('legL').setAttribute('transform',`rotate(${sw} -12 -28)`);$('legR').setAttribute('transform',`rotate(${-sw} 12 -28)`);
 const bx=back(cl((lb-0.9)/0.3));$('pbox').setAttribute('opacity',cl(bx));$('pbox').setAttribute('transform',`scale(${cl(bx,0,1.15)})`);
 $('fovB').setAttribute('opacity',0.10+0.05*Math.sin(t*5));
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.35)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.15+0.4):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'88px':'92px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(60px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const bq=back(cl((t-11.6)/0.4));$('badge').style.opacity=t>=10.9?cl(bq):0;$('badge').style.transform=`scale(${cl(bq,0,1.2)*(1+0.03*Math.sin(t*6))}) rotate(${-10+4*Math.sin(t*2)}deg)`;
 const op=ease(cl((t-11.2)/1.0));$('price').innerHTML=Math.round(8420*op).toLocaleString('de-DE')+' <b>RSD</b>';
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
