<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;background:#0b1a14}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 1100px at 50% 36%,#1a4231 0%,#0e251b 55%,#06110b 100%)}
#grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#6cc08f 1px,transparent 1px),linear-gradient(90deg,#6cc08f 1px,transparent 1px);background-size:72px 72px}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:#2f7a50}
#bar{position:absolute;top:0;left:0;height:10px;background:#6cc08f;z-index:12}
#logo{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-weight:700;font-size:34px;letter-spacing:2px;z-index:9}
#logo img{width:58px;height:58px;border-radius:14px}
#h{position:absolute;top:180px;left:70px;right:70px;text-align:center;z-index:8}
#h .a{font-weight:800;font-size:112px;line-height:1.04;color:#fff;letter-spacing:-2px}
#h .a em{font-style:normal;color:#6cc08f}
#h .b{font-weight:700;font-size:58px;line-height:1.15;color:#cfe9da;margin-top:26px}
#h .b em{font-style:normal;color:#6cc08f}
#prod{position:absolute;left:320px;top:780px;width:440px;height:440px;transform-origin:50% 50%;z-index:6}
#prod img{width:100%;height:100%;border-radius:48px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
#glow{position:absolute;left:190px;top:650px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#6cc08f55 0%,transparent 65%);z-index:5}
#tag{position:absolute;left:640px;top:700px;z-index:7;opacity:0}
#tag span{display:inline-block;white-space:nowrap;background:#fff;color:#123528;font-weight:800;font-size:48px;padding:12px 30px;border-radius:40px;border:5px dashed #d64545;box-shadow:0 14px 30px rgba(0,0,0,.35)}
#card{position:absolute;left:50px;top:560px;width:980px;height:700px;border-radius:40px;overflow:hidden;background:#0f2a1f;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px rgba(108,192,143,.35);opacity:0}
#card svg{position:absolute;left:0;top:0;width:980px;height:700px}
.pr-note{position:absolute;right:28px;bottom:22px;color:#cfe9da;font-weight:600;font-size:26px;opacity:.75}
#chip{position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;z-index:7}
#chip span{background:#fff;color:#123528;font-weight:700;font-size:46px;padding:22px 44px;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.35);white-space:nowrap}
#chip span b{color:#2f7a50}
#stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;z-index:7}
#stamp div{font-weight:800;font-size:150px;line-height:1.02;color:#fff;text-align:center;letter-spacing:-3px}
#stamp div em{font-style:normal;color:#6cc08f}
#endbg{position:absolute;inset:0;opacity:0;background:radial-gradient(1100px 1100px at 50% 45%,#ffffff 0%,#eef6f1 55%,#d7ebe0 100%)}
#end{position:absolute;inset:0;opacity:0;z-index:7;text-align:center}
#end .cat{position:absolute;top:310px;left:0;right:0;font-weight:700;font-size:40px;letter-spacing:4px;color:#2f7a50}
#end .nm{position:absolute;top:1280px;left:40px;right:40px;white-space:nowrap;font-weight:800;font-size:80px;line-height:1.05;color:#123528;letter-spacing:-1px}
#end .sub{position:absolute;top:1390px;left:60px;right:60px;font-weight:600;font-size:48px;color:#2f7a50}
#end .pr{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center}
#end .pr>span{background:#123528;color:#fff;font-weight:800;font-size:60px;padding:18px 50px;border-radius:70px;font-variant-numeric:tabular-nums}
#end .pr b{color:#6cc08f}
#end .cta{position:absolute;top:1610px;left:0;right:0;font-weight:700;font-size:42px;color:#123528}
#end .cta b{color:#2f7a50}
#badge{position:absolute;left:690px;top:470px;width:190px;height:190px;border-radius:50%;background:#2f7a50;color:#fff;font-weight:800;font-size:56px;display:flex;align-items:center;justify-content:center;z-index:8;opacity:0;box-shadow:0 18px 40px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<style>
#prod{left:240px;top:740px;width:600px;height:600px}
#glow{left:190px;top:690px;width:700px;height:700px}
#tag{left:600px;top:720px}
#h .b{font-size:54px}
</style>
<div id="bg"></div><div id="grid"></div>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="endbg"></div>
<div id="card">
 <svg viewBox="0 0 980 700">
  <defs>
   <linearGradient id="nite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07130e"/><stop offset="1" stop-color="#143627"/></linearGradient>
   <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".8"/><stop offset="1" stop-color="#fff6d8" stop-opacity=".06"/></linearGradient>
   <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="980" height="700" fill="url(#nite)"/>
  <g fill="#cfe9da" opacity=".5"><circle cx="560" cy="70" r="3"/><circle cx="700" cy="110" r="2"/><circle cx="860" cy="60" r="3"/><circle cx="420" cy="120" r="2"/></g>
  <g id="sA">
   <!-- kapija / prilaz sa autom (ilustracija) -->
   <rect x="0" y="560" width="980" height="140" fill="#0d2018"/>
   <rect x="40" y="180" width="40" height="400" fill="#1b4636"/>
   <g transform="translate(60 250)"><rect x="-14" y="-10" width="30" height="20" fill="#cfe9da"/><rect x="10" y="-22" width="100" height="44" rx="16" fill="#f4f7f5"/><rect x="104" y="-12" width="14" height="26" rx="3" fill="#0b1a14"/><circle id="led" cx="96" cy="16" r="5" fill="#fff6d8"/></g>
   <path id="beamA" d="M180 250 L980 360 L980 700 L180 262Z" fill="url(#beam)" opacity="0"/>
   <g id="scene">
    <g id="car" transform="translate(560 470)">
     <path d="M0 80 L20 20 Q30 0 60 0 L220 0 Q250 0 265 20 L300 60 L330 70 L330 110 L0 110Z" fill="#c0392b"/>
     <path d="M50 12 L90 12 L90 55 L35 55Z M105 12 L200 12 L240 55 L105 55Z" fill="#9fd0e6"/>
     <circle cx="70" cy="112" r="30" fill="#111"/><circle cx="260" cy="112" r="30" fill="#111"/><circle cx="70" cy="112" r="12" fill="#888"/><circle cx="260" cy="112" r="12" fill="#888"/>
     <rect x="300" y="72" width="26" height="14" rx="4" fill="#ffd166"/>
    </g>
    <g id="man" transform="translate(420 420)">
     <circle cx="0" cy="0" r="30" fill="#e0b48a"/><rect x="-36" y="34" width="72" height="120" rx="24" fill="#2f6fd6"/><rect x="-30" y="150" width="24" height="70" fill="#333"/><rect x="6" y="150" width="24" height="70" fill="#333"/>
    </g>
   </g>
   <g id="mode"><rect x="620" y="40" width="320" height="64" rx="32" fill="#0b1a14" stroke="#cfe9da" stroke-width="3"/><text id="modeT" x="780" y="83" fill="#cfe9da" font-family="Poppins" font-weight="800" font-size="30" text-anchor="middle">IR: crno-belo</text></g>
  </g>
  <g id="sB" opacity="0">
   <rect x="0" y="560" width="980" height="140" fill="#0d2018"/>
   <!-- kamera na zidu ulaza, koaksijalni kabl do DVR-a (ilustracija) -->
   <rect x="60" y="160" width="300" height="400" fill="#1b4636"/><rect x="150" y="380" width="110" height="180" rx="8" fill="#0b1a14"/>
   <text x="205" y="350" fill="#cfe9da" font-family="Poppins" font-weight="700" font-size="28" text-anchor="middle">Ulaz u lokal</text>
   <g transform="translate(330 220)"><rect x="-14" y="-10" width="30" height="20" fill="#cfe9da"/><rect x="10" y="-22" width="100" height="44" rx="16" fill="#f4f7f5"/><rect x="104" y="-12" width="14" height="26" rx="3" fill="#0b1a14"/></g>
   <g id="waves" fill="none" stroke="#6cc08f" stroke-width="6" stroke-linecap="round">
    <path id="wv0" d="M520 260 q 30 -40 0 -80"/><path id="wv1" d="M560 280 q 50 -60 0 -120"/><path id="wv2" d="M600 300 q 70 -80 0 -160"/>
   </g>
   <path id="coax" d="M350 240 C 450 240 450 470 640 470" stroke="#cfe9da" stroke-width="8" fill="none" stroke-dasharray="16 10"/>
   <g transform="translate(640 410)"><rect x="0" y="0" width="290" height="120" rx="20" fill="#2b2f3a" stroke="#6cc08f" stroke-width="3"/><text x="145" y="52" fill="#fff" font-family="Poppins" font-weight="800" font-size="30" text-anchor="middle">DVR snimač</text><text x="145" y="92" fill="#6cc08f" font-family="Poppins" font-weight="700" font-size="24" text-anchor="middle">slika + zvuk</text></g>
   <g id="aud" opacity="0"><rect x="-70" y="-26" width="140" height="52" rx="26" fill="#6cc08f"/><text x="0" y="10" fill="#0b1a14" font-family="Poppins" font-weight="800" font-size="26" text-anchor="middle">zvuk</text></g>
  </g>
 </svg>
 <div class="pr-note">Primer</div>
</div>
<div id="glow"></div>
<div id="prod"><img src="assets/cam.png"></div>
<div id="tag"><span>belo svetlo</span></div>
<div id="logo"><img src="assets/supervision-ikonica-512.png">SUPERVISION</div>
<div id="h"><div class="a"></div><div class="b"></div></div>
<div id="chip"><span></span></div>
<div id="stamp"><div></div></div>
<div id="end"><div class="cat">KAMERA U BOJI NOĆU · 2 MP</div><div class="nm" id="nm">Hikvision DS-2CE16D0T-LFS</div><div class="sub">Belo svetlo do 20 m · mikrofon</div>
<div class="pr"><span>Cena na upit</span></div><div class="cta">Zatraži ponudu · <b>062/618-736</b></div></div>
<div id="badge">2 MP</div>
<div id="bar"></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUTS=[2.6,5.4,8.4,10.9];
const H=[
 [0,2.6,'Noću ti je slika<br><em>crno-bela</em>?','<em>Kamera u boji noću</em><br>belo svetlo do 20 m'],
 [2.6,5.4,'Upali se svetlo.<br>Vidiš <em>boju</em>.',''],
 [5.4,8.4,'Snima i <em>zvuk</em>.<br>Ugrađen mikrofon.',''],
];
const CH=[[3.0,5.4,'<b>Belo svetlo</b> do 20 m'],[5.8,8.4,'Zvuk ide <b>koaksijalnim</b> kablom']];
const ST=[[8.4,9.2,'Infracrveno<br>do <em>30 m</em>.'],[9.2,10.0,'Ugao<br><em>101°</em>.'],[10.0,10.9,'Kućište<br><em>IP67</em>.']];
window.render=function(t){
 $('bar').style.width=(1080*cl(t/14))+'px';
 $('b1').style.transform=`translate(${-120+80*Math.sin(t*0.6)}px,${200+60*Math.cos(t*0.5)}px)`;
 $('b2').style.transform=`translate(${680+70*Math.cos(t*0.7)}px,${1250+80*Math.sin(t*0.4)}px)`;
 // proizvod 600 px, scale najviše 1.12 => <= 672 px < MAX_PX 904
 let sc=1,y=0,rot=0,po=1,ry=0;
 if(t<2.6){const p=ease(cl(t/0.9));sc=0.8+0.2*p+0.012*Math.sin(t*3);y=80-80*p+8*Math.sin(t*2.2);rot=-8+8*p;ry=30-30*p;}
 else if(t<8.4){po=0;}
 else if(t<10.9){sc=0.45;y=-520+6*Math.sin(t*3);}
 else {const p=ease(cl((t-10.9)/0.5));sc=0.45+0.4*p;y=-520+330*p+6*Math.sin(t*2)*p;}
 CUTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.25)sc=sc*(1+0.06*(1-d/0.25))});sc=Math.min(1.12,sc);
 $('prod').style.opacity=po;$('prod').style.transform=`translate(0px,${y}px) perspective(1200px) rotateY(${ry}deg) scale(${sc}) rotate(${rot}deg)`;
 $('glow').style.opacity=(t<2.6?0.7+0.3*Math.sin(t*5):t>=10.9||(t>=2.6&&t<8.4)?0:0.5);
 $('glow').style.transform=`translateY(${y}px) scale(${0.9+0.08*Math.sin(t*4)})`;
 const tg=$('tag');const tv=t<2.6?back(cl((t-1.2)/0.35)):0;tg.style.opacity=cl(tv*3);tg.style.transform=`scale(${0.5+0.5*tv}) rotate(${-6+3*Math.sin(t*6)}deg)`;
 const co=t>=2.6&&t<8.4?ease(cl((t-2.6)/0.3)):0;const card=$('card');card.style.opacity=co;
 card.style.transform=`translateY(${(1-co)*120}px) scale(${0.96+0.04*co})`;
 const b=t>=5.4;$('sA').setAttribute('opacity',b?0:1);$('sB').setAttribute('opacity',b?1:0);
 // A: IR crno-belo -> belo svetlo, boja
 const on=t>=3.9;const bq=ease(cl((t-3.9)/0.35));
 $('scene').setAttribute('filter',on?'':'url(#gray)');$('scene').setAttribute('opacity',on?0.75+0.25*bq:0.55);
 $('beamA').setAttribute('opacity',on?bq*(0.85+0.15*Math.sin(t*5)):0);
 $('led').setAttribute('fill',on?'#fff6d8':'#7a2a2a');
 $('modeT').textContent=on?'Belo svetlo: boja':'IR: crno-belo';$('modeT').setAttribute('fill',on?'#6cc08f':'#cfe9da');
 $('mode').setAttribute('transform',`translate(780 72) scale(${t>=3.9&&t<4.2?1+0.12*(1-(t-3.9)/0.3):1}) translate(-780 -72)`);
 $('car').setAttribute('transform',`translate(${560-40*ease(cl((t-2.6)/2.8))} 470)`);
 $('man').setAttribute('transform',`translate(${420+30*ease(cl((t-2.6)/2.8))} ${420-4*Math.abs(Math.sin(t*5))})`);
 // B: zvučni talasi, zvuk putuje kablom
 for(let i=0;i<3;i++){const v=t>5.6?(((t-5.6)*1.3-i*0.33)%1+1)%1:0;$('wv'+i).setAttribute('opacity',t>5.6?(1-v)*0.9:0);$('wv'+i).setAttribute('transform',`translate(${-80*v} ${20*v})`);}
 $('coax').setAttribute('stroke-dashoffset',-t*60);
 const cx=$('coax');if(t>6.0){const q=((t-6.0)/1.1)%1;const L=cx.getTotalLength();const pt=cx.getPointAtLength(L*ease(q));$('aud').setAttribute('opacity',cl(q*6)*cl((1-q)*6));$('aud').setAttribute('transform',`translate(${pt.x} ${pt.y-40})`);}else $('aud').setAttribute('opacity',0);
 const hh=H.find(h=>t>=h[0]&&t<h[1]);const he=$('h');
 if(hh){he.querySelector('.a').innerHTML=hh[2];he.querySelector('.b').innerHTML=hh[3];
  const local=t-hh[0];const p=hh[0]===0?ease(cl(t/0.35)):back(cl(local/0.35));
  he.style.opacity=hh[0]===0?cl(t/0.15+0.4):cl(local/0.12);he.style.transform=`scale(${0.86+0.14*p})`;
  he.querySelector('.a').style.fontSize=hh[0]===0?'100px':'84px';
  he.querySelector('.b').style.opacity=hh[3]?cl((t-1.0)/0.25):0;
  he.querySelector('.b').style.transform=`translateY(${(1-ease(cl((t-1.0)/0.3)))*30}px)`;}
 else he.style.opacity=0;
 const c=CH.find(c=>t>=c[0]&&t<c[1]);const ce=$('chip');
 if(c){ce.querySelector('span').innerHTML=c[2];const p=back(cl((t-c[0])/0.35));ce.style.opacity=cl((t-c[0])/0.1)*cl((c[1]-t)/0.15);ce.style.transform=`translateY(${(1-p)*80}px)`;}
 else ce.style.opacity=0;
 const sm=ST.find(s=>t>=s[0]&&t<s[1]);const se=$('stamp');
 if(sm){se.querySelector('div').innerHTML=sm[2];const p=cl((t-sm[0])/0.14);se.style.opacity=1;se.style.transform=`translateY(160px) scale(${1.5-0.5*ease(p)})`;}
 else se.style.opacity=0;
 const pr=ease(cl((t-10.9)/0.4));$('endbg').style.opacity=pr;$('end').style.opacity=pr;
 [...$('end').children].forEach((e,i)=>{const q=ease(cl((t-11.0-i*0.08)/0.4));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*40}px)`;});
 const bb=back(cl((t-11.6)/0.4));$('badge').style.opacity=t>=10.9?cl(bb):0;$('badge').style.transform=`scale(${cl(bb,0,1.2)*(1+0.03*Math.sin(t*6))}) rotate(${-10+4*Math.sin(t*2)}deg)`;
 $('logo').style.color=pr>0.5?'#123528':'#fff';
 let f=0;CUTS.forEach(cu=>{const d=t-cu;if(d>=0&&d<0.12)f=Math.max(f,0.5*(1-d/0.12))});$('flash').style.opacity=f;
};
function fit(){const e=$('nm');let fs=80;e.style.fontSize=fs+'px';while(e.scrollWidth>1000&&fs>40){fs-=2;e.style.fontSize=fs+'px';}}
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready).then(()=>{fit();render(0);});
</script></body></html>
